<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0713">
<title>Pokémon Oracle</title>
<meta name="description" content="What does your Pokémon selection say about you? Pick your favourite Pokémon of each Kanto type and read your profile.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pokémon Oracle">
<meta property="og:description" content="What does your Pokémon selection say about you?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jersey+10&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0713; --surface:#150d24; --surface2:#1d1233; --edge:#000; --line:#3b2766;
    --fg:#ece8f7; --muted:#a398c2; --accent:#8b5cf6; --accent-hi:#a78bfa; --accent-lo:#5b34b8; --glow:#c4b5fd;
    --display:'Jersey 10', ui-monospace, 'Courier New', monospace;
    --text:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --hero-img: none;
  }
  /*HERO*/
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 var(--text); }
  h1, h2, h3, .display { font-family:var(--display); font-weight:400; letter-spacing:.03em; }
  h2 { font-size:1.6rem; margin:36px 4px 10px; color:var(--glow); text-transform:uppercase; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent-hi); }

  /* Pixel UI: bordes escalonados con box-shadow, sin esquinas redondeadas */
  button { font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:1.2rem; border:0; border-radius:0; cursor:pointer;
    padding:12px 18px 16px; line-height:1.2; margin:4px; color:var(--fg); background:var(--surface2);
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
               inset -4px -4px 0 0 rgba(0,0,0,.4), inset 4px 4px 0 0 rgba(255,255,255,.12); }
  button:hover { background:var(--accent-lo); }
  button:active { transform:translateY(2px); box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 4px 4px 0 0 rgba(0,0,0,.4); }
  button:focus-visible { outline:3px dashed var(--glow); outline-offset:6px; }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-hi); color:#0b0713; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; background:var(--surface2); }
  button:disabled:hover { background:var(--surface2); color:var(--fg); }
  .card { background:var(--surface); margin:16px 4px; padding:16px 18px;
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 0 0 2px var(--line); }
  .card p { margin:6px 0 0; }

  /* Hero */
  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:96px 20px 72px; overflow:hidden; isolation:isolate;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(139,92,246,.35), transparent 70%),
      linear-gradient(180deg, rgba(11,7,19,.35), rgba(11,7,19,.88) 85%, var(--bg)),
      var(--hero-img) center/cover no-repeat,
      linear-gradient(180deg, #120a24, var(--bg)); }
  .stars { position:absolute; top:0; left:0; width:2px; height:2px; background:transparent; z-index:-1; animation:twinkle 4s steps(2) infinite; }
  .stars.b { animation-duration:6s; animation-delay:-2s; }
  @keyframes twinkle { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .stars { animation:none; } }
  .lang { position:absolute; top:16px; right:16px; display:flex; }
  .lang button { padding:8px 12px 11px; font-size:1.05rem; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .hero h1 { font-size:clamp(3rem, 12vw, 6.4rem); line-height:1.05; margin:0 0 20px; color:#fff; text-shadow:0 0 24px rgba(167,139,250,.75), 4px 4px 0 #3a1d7a; }
  .tagline { font-family:var(--display); font-size:clamp(1.25rem, 3.6vw, 1.7rem); color:var(--glow); margin:0 0 18px; text-transform:uppercase; letter-spacing:.08em; }
  .intro { max-width:560px; margin:0 auto 34px; color:var(--fg); opacity:.88; }
  .scroll-hint { margin-top:28px; color:var(--muted); font-family:var(--display); font-size:1.1rem; letter-spacing:.1em; animation:bob 1.6s steps(2) infinite; }
  @keyframes bob { 50% { transform:translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .scroll-hint { animation:none; } }

  main { max-width:980px; margin:0 auto; padding:56px 16px 64px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:18px 14px; margin:18px 0 26px; }
  @media (max-width:820px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2,1fr); } }
  #t-pick { text-align:center; }
  button.slot { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px 10px; margin:4px; text-align:center; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.slot:hover, button.opt:hover { background:var(--accent-lo); }
  .slot .type { font-family:var(--display); font-size:1.05rem; color:var(--glow); text-transform:uppercase; letter-spacing:.08em; }
  .slot .pname, .opt .pname { font-size:.82rem; line-height:1.2; }
  .slot.empty .pname { color:var(--muted); }
  .sprite { position:relative; width:96px; height:96px; background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%); background-size:200% 100%; animation:shimmer 1.2s steps(8) infinite; }
  .sprite.done { animation:none; background:none; }
  .sprite.blank { animation:none; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:2.8rem; color:var(--accent-hi); box-shadow:inset 0 0 0 2px var(--line); }
  .sprite img { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; opacity:0; transition:opacity .2s; }
  .sprite.done img { opacity:1; }
  .sprite.fail { animation:none; background:var(--surface); }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sprite { animation:none; } }
  dialog { width:min(740px,94vw); max-height:88vh; padding:0; border:0; background:var(--bg); color:var(--fg);
    box-shadow:0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
  dialog::backdrop { background:rgba(5,2,12,.78); }
  dialog header { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border-bottom:2px solid var(--line); z-index:1; }
  dialog h3 { margin:0; font-size:1.4rem; color:var(--glow); text-transform:uppercase; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:14px 10px; padding:16px; }
  button.opt { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.opt[aria-pressed="true"] { background:var(--accent-lo); box-shadow:0 -4px 0 0 var(--glow), 0 4px 0 0 var(--glow), -4px 0 0 0 var(--glow), 4px 0 0 0 var(--glow); }
  button.opt .sprite { width:80px; height:80px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .go-row { display:flex; flex-direction:column; align-items:center; gap:10px; margin:30px 0 8px; }
  .go-row button { padding:16px 28px 20px; font-size:1.5rem; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:22px 18px; margin:16px 0; }
  .cards .card { margin:4px; display:flex; flex-direction:column; gap:8px; }
  .cards.wide { grid-template-columns:1fr; }
  .card.feature { display:flex; gap:18px; align-items:flex-start; background:linear-gradient(135deg,var(--surface2),var(--surface)); }
  .trainer { align-items:center; flex-direction:row !important; }
  .trainer > div:last-child { flex:1; min-width:0; }
  .trainer small { font-family:var(--display); letter-spacing:.08em; text-transform:uppercase; font-size:1rem; }
  .trainer .rar { margin-top:6px !important; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  /* sprite del entrenador (128 px, con fondo transparente); si la imagen no existe o no carga, se queda el icono de su grupo */
  .tsprite { flex:none; width:128px; height:128px; display:flex; align-items:center; justify-content:center; background:var(--bg); box-shadow:inset 0 0 0 2px var(--line); }
  .tsprite img { width:128px; height:128px; image-rendering:pixelated; object-fit:contain; }
  .tsprite.ok .ico { display:none; }
  .tsprite .ico { width:40px; height:40px; opacity:.55; }
  .trainer .nuance { margin:4px 0 0 !important; font-family:var(--display); font-size:clamp(1.25rem,4.4vw,1.6rem); line-height:1.2; color:var(--glow); }
  .trainer .blurb { margin:10px 0 0 !important; color:var(--muted); font-size:.95rem; font-style:italic; }
  .trainer .sep { border:0; border-top:2px solid var(--line); margin:14px 0 4px; }
  /* Distintivo de rareza: placa metálica (B bronce, A plata, A+ oro) y, de S a S++, iridiscente con más intensidad cada vez. */
  .grade { position:relative; overflow:hidden; flex:none; display:inline-block; padding:2px 8px 5px; font-family:var(--display); font-size:1.3rem; line-height:1.1; letter-spacing:.04em;
    color:var(--ink); background:var(--metal); text-shadow:0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(0,0,0,.25); box-shadow:0 0 0 2px var(--rim), 0 0 12px var(--halo); }
  .grade::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.7) 50%, transparent 62%);
    transform:translateX(-130%); animation:sheen var(--sheen, 4s) steps(16) infinite; }
  @keyframes sheen { 0%, 60% { transform:translateX(-130%); } 100% { transform:translateX(130%); } }
  @keyframes irid { to { background-position:300% 0; } }
  .g-B  { --ink:#2b1407; --rim:#3d2210; --halo:rgba(160,90,40,.25);
    --metal:linear-gradient(135deg,#6e3d1b 0%,#b7783f 22%,#e8b07a 38%,#9a5a2b 55%,#cf935c 72%,#6a3a1a 100%); }
  .g-B::after { display:none; }
  .g-A  { --ink:#1b2430; --rim:#4b5563; --halo:rgba(200,210,225,.25); --sheen:5.5s;
    --metal:linear-gradient(135deg,#7b8494 0%,#d4d9e1 20%,#ffffff 36%,#9aa3b2 54%,#e6e9ef 72%,#757e8e 100%); }
  .g-Ap { --ink:#3a2500; --rim:#6b4a00; --halo:rgba(255,200,60,.4); --sheen:4.2s;
    --metal:linear-gradient(135deg,#84590a 0%,#e2b230 20%,#fff1a8 36%,#c8961a 54%,#f7d65a 72%,#855c08 100%); }
  .g-S, .g-Sp, .g-Spp { --ink:#170c33; --rim:#2a1a55; background-size:300% 100%; animation:irid var(--irid) linear infinite; }
  .g-S   { --irid:9s; --halo:rgba(167,139,250,.3); --sheen:5s;
    --metal:linear-gradient(90deg,#a9d6ff 0%,#cdb9ff 22%,#f3b9e4 40%,#fbe7a8 58%,#b5f0c8 76%,#a9d6ff 100%); }
  .g-Sp  { --irid:6s; --halo:rgba(196,140,255,.5); --sheen:3.6s;
    --metal:linear-gradient(90deg,#79c8ff 0%,#b794ff 20%,#ff9fdc 40%,#ffe58a 58%,#8af0b0 76%,#79c8ff 100%); }
  .g-Spp { --irid:3.5s; --halo:rgba(255,130,220,.7); --sheen:2.6s;
    --metal:linear-gradient(90deg,#4fb8ff 0%,#a06bff 16%,#ff7ad0 32%,#ffe066 48%,#6dffa8 64%,#ffffff 74%,#4fb8ff 100%); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--rim), 0 0 16px var(--halo); }
  @media (prefers-reduced-motion: reduce) { .grade, .grade::after { animation:none; } }
  .ico { flex:none; width:24px; height:24px; color:var(--glow); filter:drop-shadow(0 0 6px var(--accent)); }
  .card .ico + * { margin-top:0; }
  @media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .cards { grid-template-columns:1fr; } .card.feature { flex-direction:column; } }
  .radar { position:relative; height:210px; }
  .radar svg { position:absolute; left:50%; top:55%; width:150px; height:150px; transform:translate(-50%,-50%); overflow:visible; }
  .radar .lbl { position:absolute; max-width:84px; font-size:.7rem; line-height:1.15; color:var(--muted); }
  .radar-title { font-family:var(--display); font-size:1.3rem; color:var(--glow); text-transform:uppercase; letter-spacing:.06em; text-align:center; }
  .share-url { width:min(420px,90%); padding:8px; font:.8rem var(--text); color:var(--fg); background:var(--bg); border:2px solid var(--line); }
  .px { position:fixed; width:6px; height:6px; pointer-events:none; z-index:50; animation:pxfly .7s steps(7) forwards; }
  @keyframes pxfly { to { transform:translate(var(--dx),var(--dy)); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .px { display:none; } }
  .arch { font-family:var(--display); font-size:clamp(1.7rem,6vw,2.3rem); line-height:1.15; margin:0 !important; color:#fff; text-shadow:0 0 14px rgba(167,139,250,.6); }
  .axis { margin:16px 0; }
  .poles { display:flex; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--muted); }
  .track { position:relative; height:10px; margin-top:8px; background:var(--surface2); box-shadow:inset 0 0 0 2px var(--line); }
  .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--muted); }
  .dot { position:absolute; top:-5px; width:16px; height:20px; background:var(--accent-hi); box-shadow:0 0 0 2px #000, 0 0 10px var(--accent); }
  details > summary { cursor:pointer; margin:16px 4px 8px; padding:8px 0; }
  .entry b { display:block; font-weight:400; font-family:var(--display); font-size:1.4rem; line-height:1.15; color:var(--glow); letter-spacing:.03em; }
  .entry small { color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:.85rem; } td,th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  .legal { max-width:860px; margin:0 auto; padding:32px 16px 48px; border-top:2px solid var(--line); font-size:.8rem; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<section class="hero" id="hero">
  <i class="stars" id="stars-a"></i><i class="stars b" id="stars-b"></i>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" id="lang-es" aria-pressed="false">ES</button>
  </div>
  <h1 id="t-title"></h1>
  <p class="tagline" id="t-tag"></p>
  <p class="intro" id="t-intro"></p>
  <button type="button" class="primary" id="cta"></button>
  <span class="scroll-hint" aria-hidden="true">▼</span>
</section>
<main id="select">
  <h2 id="t-pick"></h2>
  <div class="grid" id="slots"></div>
  <dialog id="picker"><header><h3 id="picker-title"></h3><button id="picker-close" type="button"></button></header><div class="opts" id="opts"></div></dialog>
  <div class="go-row">
    <button class="primary" id="go" disabled></button>
    <span class="muted" id="count"></span>
  </div>
  <div class="row" id="debug-tools" hidden>
    <button id="rand" type="button">Random (debug)</button>
    <label class="muted"><input type="checkbox" id="std" checked> Normalize axes</label>
  </div>
  <div id="out" hidden></div>
</main>
<footer class="legal" id="legal"></footer>
<script type="module">
/*DATA*/
/*ENGINE*/

const model = buildModel(DATA.axes, DATA.pokemon, DATA.catalog, DATA.tensions);
const trainerModel = buildTrainer(DATA.trainer.rules, DATA.pokemon, DATA.trainer.extra, model.order);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Regla de diseño: el resultado no asocia ningún texto a un Pokémon concreto ("proteger la magia").
// Con #debug en la URL se muestran los Pokémon y el detalle del cálculo, solo para pruebas.
const DEBUG = location.hash === '#debug';

// ---- Enlace para compartir: los 15 números de la Pokédex (en el orden de los tipos) en el hash, p. ej. #s=6.9.25. Se recalcula todo en el navegador.
const HASH_RE = /^#s=(\d{1,3}(?:\.\d{1,3}){14})$/;

// ---- Idiomas. Inglés por defecto; la elección se recuerda si el navegador deja guardarla.
const UI = {

// ---- Gráficas de estrella: los 15 ejes en 3 grupos de 5. El centro es el primer polo y el borde el segundo.
const GROUPS = [['fuego', 'agua', 'planta', 'hielo', 'roca'], ['veneno', 'tierra', 'psiquico', 'fantasma', 'lucha'], ['electrico', 'volador', 'bicho', 'dragon', 'normal']];
function radar(types, profile, c) {
  const n = types.length, R = 75, C0 = 75;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [C0 + R * v / 10 * Math.cos(ang(i)), C0 + R * v / 10 * Math.sin(ang(i))].map(x => x.toFixed(1)).join(',');
  const ring = v => types.map((_, i) => pt(i, v)).join(' ');
  let svg = '<svg viewBox="0 0 150 150" shape-rendering="crispEdges" aria-hidden="true">';
  for (const v of [2.5, 5, 7.5, 10]) svg += `<polygon points="${ring(v)}" fill="none" stroke="${v === 5 ? '#5b34b8' : '#3b2766'}" stroke-width="${v === 10 ? 2 : 1}"/>`;
  types.forEach((_, i) => svg += `<line x1="${C0}" y1="${C0}" x2="${pt(i, 10).split(',')[0]}" y2="${pt(i, 10).split(',')[1]}" stroke="#3b2766"/>`);
  svg += `<polygon points="${types.map((t, i) => pt(i, profile[t])).join(' ')}" fill="rgba(139,92,246,.45)" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="miter"/>`;
  types.forEach((t, i) => { const [x, y] = pt(i, profile[t]).split(','); svg += `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="#fff"/>`; });
  svg += '</svg>';
  const labels = types.map((t, i) => {
    const a = ang(i), cx = Math.cos(a), cy = Math.sin(a);
    const dx = ((R + 8) * cx).toFixed(0), dy = ((R + 6) * cy).toFixed(0);
    const tx = Math.abs(cx) < .3 ? '-50%' : cx > 0 ? '0' : '-100%', ty = cy < -.3 ? '-100%' : cy > .3 ? '0' : '-50%';
    const ax = c.axis(t);
    return `<span class="lbl" style="left:calc(50% + ${dx}px);top:calc(55% + ${dy}px);transform:translate(${tx},${ty});text-align:${Math.abs(cx) < .3 ? 'center' : cx > 0 ? 'left' : 'right'}" title="${esc(ax.low)} ↔ ${esc(ax.high)}">${esc(ax.name)}</span>`;
  }).join('');
  return svg + labels;
}

// ---- Imagen para compartir (canvas 1080x1350): arquetipo, los 15 Pokémon elegidos y el enlace. No lleva ningún texto ligado a un Pokémon.
const SITE = 'rafafields.github.io/pokemon-oracle';
function loadSprite(name) {
  return new Promise(res => {

    img.crossOrigin = 'anonymous'; // sin esto el canvas queda "contaminado" y no se puede exportar
    img.onload = () => res(img);

function wrapLines(ctx, text, maxW, maxLines) {

    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);

}
async function makeImage() {

  x.shadowColor = 'rgba(167,139,250,.9)'; x.shadowBlur = 26; x.fillStyle = '#fff'; x.fillText(u.title, W / 2, 155); x.shadowBlur = 0;

$('cta').onclick = () => $('select').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
$('go').onclick = () => render(true);

// Partículas de píxel al pasar el ratón por los botones principales.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#8b5cf6'];
  let last = 0;
  for (const b of [$('go'), $('cta')]) b.addEventListener('pointermove', e => {
    if (b.disabled || e.pointerType === 'touch') return;
    const now = performance.now();
    if (now - last < 45) return;
    last = now;
    for (let i = 0; i < 2; i++) {
      const p = document.createElement('i');
      p.className = 'px';
      const sz = 4 + 2 * Math.floor(Math.random() * 2);
      p.style.cssText = `left:${e.clientX - sz / 2}px;top:${e.clientY - sz / 2}px;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random() * colors.length)]};--dx:${Math.round((Math.random() - .5) * 70 / 4) * 4}px;--dy:${Math.round((-10 - Math.random() * 50) / 4) * 4}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  });
}

// Estrellas de píxel del hero: posiciones fijas (generador con semilla) para que no cambien entre cargas.
function stars(el, n, seed, size) {
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#ede9fe'];
  el.style.boxShadow = Array.from({ length: n }, () => `${(rnd() * 100).toFixed(1)}vw ${(rnd() * 100).toFixed(1)}svh 0 ${size}px ${colors[Math.floor(rnd() * colors.length)]}`).join(',');
}
stars($('stars-a'), 70, 5, 0);
stars($('stars-b'), 40, 9, 1);
if (DEBUG) {
  $('debug-tools').hidden = false;
  $('rand').onclick = () => {
    for (const t of model.order) { const l = model.lists[t]; state[t] = l[Math.floor(Math.random() * l.length)].name; }
    applyLang(); render(true);
  };
}
if (!DEBUG && loadHash()) {
  applyLang(); render(false);
  requestAnimationFrame(() => $('out').scrollIntoView({ behavior: 'auto' }));
} else applyLang();
addEventListener('hashchange', () => { if (!DEBUG && loadHash()) { applyLang(); render(true); } });
</script>
</body>
</html>
