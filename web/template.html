<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0713">
<title>Pokémon Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0713; --surface:#150d24; --surface2:#1d1233; --edge:#000; --line:#3b2766;
    --fg:#ece8f7; --muted:#a398c2; --accent:#8b5cf6; --accent-hi:#a78bfa; --accent-lo:#5b34b8; --glow:#c4b5fd;
    --display:'Silkscreen', ui-monospace, 'Courier New', monospace;
    --text:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --hero-img: none;
  }
  /*HERO*/
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 var(--text); }
  h1, h2, h3, .display { font-family:var(--display); font-weight:700; letter-spacing:.04em; }
  h2 { font-size:1.1rem; margin:36px 4px 10px; color:var(--glow); text-transform:uppercase; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent-hi); }

  /* Pixel UI: bordes escalonados con box-shadow, sin esquinas redondeadas */
  button { font-family:var(--display); font-weight:700; letter-spacing:.05em; font-size:.8rem; border:0; border-radius:0; cursor:pointer;
    padding:12px 18px; margin:4px; color:var(--fg); background:var(--surface2);
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
               inset -4px -4px 0 0 rgba(0,0,0,.4), inset 4px 4px 0 0 rgba(255,255,255,.12); }
  button:hover { background:var(--accent-lo); }
  button:active { transform:translateY(2px); box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 4px 4px 0 0 rgba(0,0,0,.4); }
  button:focus-visible { outline:3px dashed var(--glow); outline-offset:6px; }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-hi); color:#0b0713; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; background:var(--surface2); }
  button:disabled:hover { background:var(--surface2); color:var(--fg); }
  .card { background:var(--surface); margin:16px 4px; padding:16px 18px;
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 0 0 2px var(--line); }
  .card p { margin:6px 0 0; }

  /* Hero */
  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:96px 20px 72px; overflow:hidden; isolation:isolate;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(139,92,246,.35), transparent 70%),
      linear-gradient(180deg, rgba(11,7,19,.35), rgba(11,7,19,.88) 85%, var(--bg)),
      var(--hero-img) center/cover no-repeat,
      linear-gradient(180deg, #120a24, var(--bg)); }
  .stars { position:absolute; top:0; left:0; width:2px; height:2px; background:transparent; z-index:-1; animation:twinkle 4s steps(2) infinite; }
  .stars.b { animation-duration:6s; animation-delay:-2s; }
  @keyframes twinkle { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .stars { animation:none; } }
  .lang { position:absolute; top:16px; right:16px; display:flex; }
  .lang button { padding:8px 12px; font-size:.7rem; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .hero h1 { font-size:clamp(2.2rem, 9vw, 4.5rem); line-height:1.05; margin:0 0 20px; color:#fff; text-shadow:0 0 24px rgba(167,139,250,.75), 4px 4px 0 #3a1d7a; }
  .tagline { font-family:var(--display); font-size:clamp(.85rem, 2.6vw, 1.15rem); color:var(--glow); margin:0 0 18px; text-transform:uppercase; letter-spacing:.08em; }
  .intro { max-width:560px; margin:0 auto 34px; color:var(--fg); opacity:.88; }
  .scroll-hint { margin-top:28px; color:var(--muted); font-family:var(--display); font-size:.7rem; letter-spacing:.1em; animation:bob 1.6s steps(2) infinite; }
  @keyframes bob { 50% { transform:translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .scroll-hint { animation:none; } }

  main { max-width:980px; margin:0 auto; padding:56px 16px 64px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:18px 14px; margin:18px 0 26px; }
  button.slot { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px 10px; margin:4px; text-align:center; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.slot:hover, button.opt:hover { background:var(--accent-lo); }
  .slot .type { font-family:var(--display); font-size:.68rem; color:var(--glow); text-transform:uppercase; letter-spacing:.08em; }
  .slot .pname, .opt .pname { font-size:.82rem; line-height:1.2; }
  .slot.empty .pname { color:var(--muted); }
  .sprite { position:relative; width:96px; height:96px; background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%); background-size:200% 100%; animation:shimmer 1.2s steps(8) infinite; }
  .sprite.done { animation:none; background:none; }
  .sprite.blank { animation:none; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:2rem; color:var(--accent-hi); box-shadow:inset 0 0 0 2px var(--line); }
  .sprite img { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; opacity:0; transition:opacity .2s; }
  .sprite.done img { opacity:1; }
  .sprite.fail { animation:none; background:var(--surface); }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sprite { animation:none; } }
  dialog { width:min(740px,94vw); max-height:88vh; padding:0; border:0; background:var(--bg); color:var(--fg);
    box-shadow:0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
  dialog::backdrop { background:rgba(5,2,12,.78); }
  dialog header { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border-bottom:2px solid var(--line); z-index:1; }
  dialog h3 { margin:0; font-size:.95rem; color:var(--glow); text-transform:uppercase; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:14px 10px; padding:16px; }
  button.opt { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.opt[aria-pressed="true"] { background:var(--accent-lo); box-shadow:0 -4px 0 0 var(--glow), 0 4px 0 0 var(--glow), -4px 0 0 0 var(--glow), 4px 0 0 0 var(--glow); }
  button.opt .sprite { width:80px; height:80px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .go-row { display:flex; flex-direction:column; align-items:center; gap:10px; margin:30px 0 8px; }
  .go-row button { padding:16px 28px; font-size:.95rem; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:22px 18px; margin:16px 0; }
  .cards .card { margin:4px; display:flex; flex-direction:column; gap:8px; }
  .cards.wide { grid-template-columns:1fr; }
  .card.feature { display:flex; gap:18px; align-items:flex-start; background:linear-gradient(135deg,var(--surface2),var(--surface)); }
  .ico { flex:none; width:24px; height:24px; color:var(--glow); filter:drop-shadow(0 0 6px var(--accent)); }
  .card .ico + * { margin-top:0; }
  @media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .cards { grid-template-columns:1fr; } .card.feature { flex-direction:column; } }
  .px { position:fixed; width:6px; height:6px; pointer-events:none; z-index:50; animation:pxfly .7s steps(7) forwards; }
  @keyframes pxfly { to { transform:translate(var(--dx),var(--dy)); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .px { display:none; } }
  .arch { font-family:var(--display); font-size:clamp(1.15rem,4.5vw,1.6rem); line-height:1.25; margin:0 !important; color:#fff; text-shadow:0 0 14px rgba(167,139,250,.6); }
  .axis { margin:16px 0; }
  .poles { display:flex; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--muted); }
  .track { position:relative; height:10px; margin-top:8px; background:var(--surface2); box-shadow:inset 0 0 0 2px var(--line); }
  .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--muted); }
  .dot { position:absolute; top:-5px; width:16px; height:20px; background:var(--accent-hi); box-shadow:0 0 0 2px #000, 0 0 10px var(--accent); }
  details > summary { cursor:pointer; margin:16px 4px 8px; padding:8px 0; }
  .entry b { display:block; font-family:var(--display); font-size:.95rem; color:var(--glow); letter-spacing:.03em; }
  .entry small { color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:.85rem; } td,th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  .legal { max-width:860px; margin:0 auto; padding:32px 16px 48px; border-top:2px solid var(--line); font-size:.8rem; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<section class="hero" id="hero">
  <i class="stars" id="stars-a"></i><i class="stars b" id="stars-b"></i>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" id="lang-es" aria-pressed="false">ES</button>
  </div>
  <h1 id="t-title"></h1>
  <p class="tagline" id="t-tag"></p>
  <p class="intro" id="t-intro"></p>
  <button type="button" class="primary" id="cta"></button>
  <span class="scroll-hint" aria-hidden="true">▼</span>
</section>
<main id="select">
  <h2 id="t-pick"></h2>
  <div class="grid" id="slots"></div>
  <dialog id="picker"><header><h3 id="picker-title"></h3><button id="picker-close" type="button"></button></header><div class="opts" id="opts"></div></dialog>
  <div class="go-row">
    <button class="primary" id="go" disabled></button>
    <span class="muted" id="count"></span>
  </div>
  <div class="row" id="debug-tools" hidden>
    <button id="rand" type="button">Random (debug)</button>
    <label class="muted"><input type="checkbox" id="std" checked> Normalize axes</label>
  </div>
  <div id="out" hidden></div>
</main>
<footer class="legal" id="legal"></footer>
<script type="module">
/*DATA*/
/*ENGINE*/

const model = buildModel(DATA.axes, DATA.pokemon, DATA.catalog, DATA.tensions);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Regla de diseño: el resultado no asocia ningún texto a un Pokémon concreto ("proteger la magia").
// Con #debug en la URL se muestran los Pokémon y el detalle del cálculo, solo para pruebas.
const DEBUG = location.hash === '#debug';

// ---- Idiomas. Inglés por defecto; la elección se recuerda si el navegador deja guardarla.
const UI = {
  en: {
    title: 'Pokémon Oracle',
    tag: 'What does your Pokémon selection say about you?',
    cta: 'Choose your Pokémon',
    pick: 'Pick one Pokémon per type',
    intro: 'Choose your favourite Pokémon of each Kanto type and let the oracle read you. It is a game, not a validated psychological test: it borrows the vocabulary of personality to give you a text you can recognise yourself in. Test version: the catalogue is a draft.',
    type: t => `Your favourite ${t} Pokémon`,
    close: 'Close',
    go: 'This is what it says about you',
    count: n => n < 15 ? `${n} of 15 chosen` : 'All 15 chosen',
    choose: 'Choose',
    change: 'Change',
    profile: 'Your profile',
    most: 'What says the most about you',
    all: n => `See all the detail (${n} more)`,
    tensions: 'Tensions',
    noTension: 'Nothing worth mentioning.',
    axes: 'The 15 axes',
    dbl1: 'You picked the same Pokémon in two slots',
    dblN: n => `You picked the same Pokémon in ${n} pairs of slots`,
    dblTail: ', and that says something about you too.',
    inner: a => `You move between two extremes in ${a}.`,
    pattern: (ty, n, e) => `Many of your Pokémon have ${ty} as a second type (${n}; you would expect about ${e}).`,
    legal: [
      'Pokémon Oracle is a fan project, non-profit and unaffiliated with Nintendo, Game Freak or The Pokémon Company. Pokémon and Pokémon character names are trademarks of their owners: © Nintendo / Creatures Inc. / GAME FREAK inc.',
      'Pokémon images come from <a href="https://github.com/PokeAPI/sprites" target="_blank" rel="noopener">PokeAPI/sprites</a> (<a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>) and belong to their owners. Icons: <a href="https://github.com/halfmage/pixelarticons" target="_blank" rel="noopener">Pixelarticons</a> (MIT).',
      '<a href="https://github.com/rafafields/pokemon-oracle" target="_blank" rel="noopener">Code and documentation on GitHub</a>',
    ],
    text: { connectors: ['At the same time,', 'Alongside that,', 'On top of that,', 'And meanwhile,'], joiner: 'with', deep: 'Deep down,' },
  },
  es: {
    title: 'Oráculo Pokémon',
    tag: '¿Qué dice tu selección de Pokémon sobre ti?',
    cta: 'Elige tus Pokémon',
    pick: 'Elige un Pokémon por tipo',
    intro: 'Elige tu Pokémon favorito de cada tipo de Kanto. Es un juego, no un test psicológico validado: usa vocabulario de personalidad para dar un texto reconocible. Versión de pruebas: el catálogo es un borrador.',
    type: t => `Tu favorito de tipo ${t}`,
    close: 'Cerrar',
    go: 'Esto dice de ti',
    count: n => n < 15 ? `${n} de 15 elegidos` : 'Los 15 elegidos',
    choose: 'Elegir',
    change: 'Cambiar',
    profile: 'Tu perfil',
    most: 'Lo que más dice de ti',
    all: n => `Ver todo el detalle (${n} más)`,
    tensions: 'Tensiones',
    noTension: 'Ninguna destacable.',
    axes: 'Los 15 ejes',
    dbl1: 'Has repetido una elección en dos casillas',
    dblN: n => `Has repetido ${n} elecciones en dos casillas`,
    dblTail: ', y eso también dice algo de ti.',
    inner: a => `Te mueves entre dos extremos en ${a}.`,
    pattern: (ty, n, e) => `Muchos de tus Pokémon tienen ${ty} como segundo tipo (${n}; lo esperable serían ${e}).`,
    legal: [
      'Oráculo Pokémon es un proyecto de fans, sin ánimo de lucro y sin relación con Nintendo, Game Freak ni The Pokémon Company. Pokémon y los nombres de los Pokémon son marcas de sus propietarios: © Nintendo / Creatures Inc. / GAME FREAK inc.',
      'Las imágenes de los Pokémon proceden de <a href="https://github.com/PokeAPI/sprites" target="_blank" rel="noopener">PokeAPI/sprites</a> (<a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>) y pertenecen a sus propietarios. Iconos: <a href="https://github.com/halfmage/pixelarticons" target="_blank" rel="noopener">Pixelarticons</a> (MIT).',
      '<a href="https://github.com/rafafields/pokemon-oracle" target="_blank" rel="noopener">Código y documentación en GitHub</a>',
    ],
    text: undefined, // el motor trae los conectores en español por defecto
  },
};
// Contenido por idioma: tipos, ejes, polos, entradas del catálogo y textos de las tensiones.
const content = {
  en: {
    type: t => DATA.en.types[t], axis: t => DATA.en.axes[t], poles: DATA.en.poles,
    entry: c => c.kind === 'double' ? DATA.en.doubles[c.pokemon] : DATA.en.entries[c.pokemon + '|' + c.axis],
    tension: i => DATA.en.tensions[i],
  },
  es: {
    type: t => DATA.axes.find(a => a.type === t).typeName, axis: t => DATA.axes.find(a => a.type === t), poles: DATA.poles,
    entry: c => c.kind === 'double' ? DATA.catalog.double.find(d => d.pokemon === c.pokemon)
      : DATA.catalog.simple.find(x => x.pokemon === c.pokemon && x.type === c.axis),
    tension: i => DATA.tensions[i].idea,
  },
};
let lang = 'en';
try { const s = localStorage.getItem('oracle-lang'); if (s === 'es' || s === 'en') lang = s; } catch (e) { /* sin almacenamiento */ }
const ui = () => UI[lang];
const C = () => content[lang];
const KIND = { primary: 'primary', secondary: 'second type', double: 'double selection' };

// ---- Sprites: solo se piden imágenes por URL a PokeAPI/sprites (no se llama a la API). Son ~1 KB cada una.
// Primero CDN (jsDelivr) y, si falla, GitHub; si también falla, se queda el nombre sin imagen.
const SPRITE = [id => `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${id}.png`,
                id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`];
const idOf = Object.fromEntries(DATA.pokemon.map(p => [p.name, p.id]));
function sprite(name, size) {
  const box = document.createElement('span');
  box.className = 'sprite';
  if (size) { box.style.width = box.style.height = size + 'px'; }
  const img = document.createElement('img');
  img.alt = '';
  img.decoding = 'async';
  img.loading = 'lazy';
  let k = 0;
  img.onload = () => box.classList.add('done');
  img.onerror = () => { if (++k < SPRITE.length) img.src = SPRITE[k](idOf[name]); else box.classList.add('fail'); };
  img.src = SPRITE[0](idOf[name]);
  box.appendChild(img);
  return box;
}

// ---- Selectores
const state = {};
const slotBtn = {};
const chosen = () => model.order.filter(t => state[t]).length;
function paintSlot(t) {
  const b = slotBtn[t];
  b.replaceChildren();
  b.classList.toggle('empty', !state[t]);
  const ty = document.createElement('span'); ty.className = 'type'; ty.textContent = C().type(t);
  const nm = document.createElement('span'); nm.className = 'pname';
  let sp;
  if (state[t]) { nm.textContent = state[t]; sp = sprite(state[t]); }
  else { nm.textContent = ui().choose; sp = document.createElement('span'); sp.className = 'sprite blank'; sp.textContent = '?'; }
  b.append(ty, sp, nm);
  b.setAttribute('aria-label', `${C().type(t)}: ${state[t] || ui().choose}`);
}
function paintStatus() {
  $('go').disabled = chosen() < 15;
  $('count').textContent = ui().count(chosen());
}
const picker = $('picker');
function openPicker(t) {
  $('picker-title').textContent = ui().type(C().type(t));
  const box = $('opts');
  box.replaceChildren();
  for (const p of model.lists[t]) {
    const o = document.createElement('button');
    o.type = 'button'; o.className = 'opt';
    o.setAttribute('aria-pressed', String(p.name === state[t]));
    const nm = document.createElement('span'); nm.className = 'pname'; nm.textContent = p.name;
    o.append(sprite(p.name, 80), nm);
    o.onclick = () => { state[t] = p.name; paintSlot(t); paintStatus(); picker.close(); };
    box.appendChild(o);
  }
  picker.showModal();
  box.querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: 'center' });
}
$('picker-close').onclick = () => picker.close();
picker.addEventListener('click', e => { if (e.target === picker) picker.close(); });

for (const t of model.order) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'slot';
  b.onclick = () => openPicker(t);
  slotBtn[t] = b;
  $('slots').appendChild(b);
}

// Precarga tranquila del resto de sprites cuando el navegador está libre, para que los selectores abran al instante.
const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
function prefetch(names) {
  const batch = names.splice(0, 12);
  for (const n of batch) new Image().src = SPRITE[0](idOf[n]);
  if (names.length) idle(() => prefetch(names));
}
idle(() => prefetch([...new Set(model.order.flatMap(t => model.lists[t].map(p => p.name)))]));

// ---- Iconos pixel art (Pixelarticons, MIT). Se eligen por el texto de la etiqueta, nunca por tipo ni eje, para no revelar de dónde sale cada entrada.
const ICONS = /*ICONS*/;
const icon = n => `<svg class="ico" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const ENTRY_ICONS = ['star', 'eye', 'heart', 'sun', 'crown', 'feather', 'key', 'diamond-gem', 'wand', 'hourglass', 'compass', 'lightbulb', 'fire', 'shield'];
function iconFor(label) { let h = 0; for (const ch of label) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ENTRY_ICONS[h % ENTRY_ICONS.length]; }

// ---- Resultado
let shown = false;
function render(scroll) {
  const r = computeResult(model, { ...state }, { standardize: $('std').checked });
  const u = ui(), c = C();
  const at = archetypeText(c.poles, r.archetype, u.text);
  let h = `<h2>${esc(u.profile)}</h2><div class="card feature">${icon('moon')}<div><p class="arch">${esc(at.title)}</p>`;
  if (at.paragraph) h += `<p>${esc(at.paragraph)}</p>`;
  if (at.nuance) h += `<p>${esc(at.nuance)}</p>`;
  h += '</div></div>';
  if (r.doubles.length) h += `<div class="card feature">${icon('infinity')}<div>${esc(r.doubles.length === 1 ? u.dbl1 : u.dblN(r.doubles.length))}${esc(u.dblTail)}${DEBUG ? ' <span class="muted">[' + r.doubles.map(esc).join(', ') + ']</span>' : ''}</div></div>`;
  const card = x => {
    const e = c.entry(x);
    const dbg = DEBUG ? `<small>${esc(x.pokemon)} · ${esc(c.axis(x.axis).name)} ${x.pos} · ${KIND[x.kind]} · relevance ${x.score.toFixed(2)}</small>` : '';
    return `<div class="card entry">${icon(iconFor(e.label))}<b>${esc(e.label)}</b>${dbg}<p>${esc(e.text)}</p></div>`;
  };
  h += `<h2>${esc(u.most)}</h2>`;
  h += `<div class="cards">${r.revealing.map(card).join('')}</div>`;
  const rest = r.scored.filter(x => !r.revealing.includes(x));
  if (rest.length) h += `<details><summary class="muted">${esc(u.all(rest.length))}</summary><div class="cards">${rest.map(card).join('')}</div></details>`;
  h += `<h2>${esc(u.tensions)}</h2>`;
  if (!r.tensions.length) h += `<p class="muted">${esc(u.noTension)}</p>`;
  const tcards = r.tensions.map(tn => `<div class="card">${icon('zap')}<p>${esc(tn.kind === 'axes' ? c.tension(tn.index) : u.inner(c.axis(tn.axis).name))}</p></div>`);
  if (r.pattern) tcards.push(`<div class="card">${icon('sparkles')}<p>${esc(u.pattern(c.type(r.pattern.type), r.pattern.observed, (r.pattern.observed - r.pattern.dev).toFixed(1)))}</p></div>`);
  if (tcards.length) h += `<div class="cards">${tcards.join('')}</div>`;
  h += `<h2>${esc(u.axes)}</h2><div class="card">`;
  for (const t of model.order) {
    const v = r.profile[t], a = c.axis(t);
    h += `<div class="axis"><div class="poles"><span>${esc(a.low)}</span><span>${esc(a.high)}</span></div><div class="track"><div class="mid"></div><div class="dot" style="left:${v * 10}%;transform:translateX(-${v * 10}%)"></div></div>${DEBUG ? `<div class="muted">${esc(a.name)}: ${v.toFixed(1)}</div>` : ''}</div>`;
  }
  h += '</div>';
  if (DEBUG) {
    h += '<details open><summary class="muted">Calculation detail</summary><div class="card"><table><tr><th>Axis</th><th>Pokémon</th><th>Origin</th><th>Pos.</th><th>Weight</th></tr>';
    for (const x of [...r.contribs].sort((p, q) => model.order.indexOf(p.axis) - model.order.indexOf(q.axis))) {
      h += `<tr><td>${esc(c.axis(x.axis).name)}</td><td>${esc(x.pokemon)}</td><td>${KIND[x.kind]}</td><td>${x.pos}</td><td>${x.w.toFixed(2)}</td></tr>`;
    }
    h += '</table></div></details>';
  }
  $('out').innerHTML = h;
  $('out').hidden = false;
  shown = true;
  if (scroll) $('out').scrollIntoView({ behavior: 'smooth' });
}

// ---- Textos fijos y cambio de idioma
function applyLang() {
  const u = ui();
  document.documentElement.lang = lang;
  document.title = u.title;
  $('t-title').textContent = u.title;
  $('t-tag').textContent = u.tag;
  $('t-intro').textContent = u.intro;
  $('cta').textContent = u.cta;
  $('t-pick').textContent = u.pick;
  $('go').textContent = u.go;
  $('picker-close').textContent = u.close;
  $('legal').innerHTML = u.legal.map(p => `<p>${p}</p>`).join('');
  $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
  $('lang-es').setAttribute('aria-pressed', String(lang === 'es'));
  for (const t of model.order) paintSlot(t);
  paintStatus();
  if (shown) render(false);
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('oracle-lang', l); } catch (e) { /* sin almacenamiento */ }
  if (picker.open) picker.close();
  applyLang();
}
$('lang-en').onclick = () => setLang('en');
$('lang-es').onclick = () => setLang('es');

$('cta').onclick = () => $('select').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
$('go').onclick = () => render(true);

// Partículas de píxel al pasar el ratón por los botones principales.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#8b5cf6'];
  let last = 0;
  for (const b of [$('go'), $('cta')]) b.addEventListener('pointermove', e => {
    if (b.disabled || e.pointerType === 'touch') return;
    const now = performance.now();
    if (now - last < 45) return;
    last = now;
    for (let i = 0; i < 2; i++) {
      const p = document.createElement('i');
      p.className = 'px';
      const sz = 4 + 2 * Math.floor(Math.random() * 2);
      p.style.cssText = `left:${e.clientX - sz / 2}px;top:${e.clientY - sz / 2}px;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random() * colors.length)]};--dx:${Math.round((Math.random() - .5) * 70 / 4) * 4}px;--dy:${Math.round((-10 - Math.random() * 50) / 4) * 4}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  });
}

// Estrellas de píxel del hero: posiciones fijas (generador con semilla) para que no cambien entre cargas.
function stars(el, n, seed, size) {
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#ede9fe'];
  el.style.boxShadow = Array.from({ length: n }, () => `${(rnd() * 100).toFixed(1)}vw ${(rnd() * 100).toFixed(1)}svh 0 ${size}px ${colors[Math.floor(rnd() * colors.length)]}`).join(',');
}
stars($('stars-a'), 70, 5, 0);
stars($('stars-b'), 40, 9, 1);
if (DEBUG) {
  $('debug-tools').hidden = false;
  $('rand').onclick = () => {
    for (const t of model.order) { const l = model.lists[t]; state[t] = l[Math.floor(Math.random() * l.length)].name; }
    applyLang(); render(true);
  };
}
applyLang();
</script>
