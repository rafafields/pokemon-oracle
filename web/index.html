// funciona igual en el navegador y en Node. Ver docs/Motor de perfil y reglas de tensión.md.

export const DEFAULTS = {
  popWeight: { 5: 0.5, 4: 0.7, 3: 1.0, 2: 1.3, 1: 1.6 },
  secBase: 0.3, secSlope: 0.3, secMin: 0.1, secMax: 1,
  patternMinCount: 4, patternMinDev: 2.5,
  flatThreshold: 1.5, thirdAxisThreshold: 2,
  tensionPole: 3, tensionMax: 2, innerGap: 9,
  // Con standardize, la intensidad de un eje se mide en desviaciones típicas respecto a su media
  // (calculada con selecciones al azar sobre el catálogo) en lugar de respecto a 5.
  standardize: true,
  z: { flat: 0.5, third: 0.8, tension: 1.2 },
  calibrationSamples: 4000,
  // 'profile': la popularidad pesa al promediar las posiciones de un eje (comportamiento inicial).
  // 'dominance': el perfil no usa la popularidad; solo multiplica la intensidad del eje, es decir,
  // decide qué ejes destacan. Así elegir a un Pokémon muy popular no diluye su propio eje.
  popMode: 'profile',
};

export function buildModel(axes, pokemon, catalog, tensions, config = {}) {
  const cfg = { ...DEFAULTS, ...config };
  const order = axes.map(a => a.type);
  const byName = new Map(pokemon.map(p => [p.name, p]));
  const simple = new Map(catalog.simple.map(e => [e.pokemon + '|' + e.type, e]));
  const double = new Map(catalog.double.map(e => [e.pokemon, e]));
  const lists = Object.fromEntries(order.map(t => [t, pokemon.filter(p => p.types.includes(t))]));
  const other = (p, t) => p.types.find(x => x !== t);
  // Esperado de cada tipo secundario: suma sobre casillas de P(el elegido al azar tiene U como otro tipo).
  const expected = Object.fromEntries(order.map(t => [t, 0]));
  for (const t of order) {
    for (const p of lists[t]) if (p.types.length === 2) expected[other(p, t)] += 1 / lists[t].length;
  }
  const model = { cfg, axes, order, byName, simple, double, lists, expected, other, tensions, stats: null };
  model.stats = calibrate(model);
  return model;
}

// Media y desviación de cada eje con selecciones uniformes al azar y una semilla fija (determinista).
export function calibrate(model, n = model.cfg.calibrationSamples, seed = 12345) {
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const sum = {}, sq = {};
  for (const t of model.order) { sum[t] = 0; sq[t] = 0; }
  for (let i = 0; i < n; i++) {
    const sel = {};
    for (const t of model.order) { const l = model.lists[t]; sel[t] = l[Math.floor(rnd() * l.length)].name; }
    const prof = computeResult(model, sel, { standardize: false }).profile;
    for (const t of model.order) { sum[t] += prof[t]; sq[t] += prof[t] * prof[t]; }
  }
  const stats = {};
  for (const t of model.order) {
    const mean = sum[t] / n;
    stats[t] = { mean, sd: Math.sqrt(Math.max(sq[t] / n - mean * mean, 1e-6)) };
  }
  return stats;
}

const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

export function computeResult(model, selection, opts = {}) {
  const std = opts.standardize ?? model.cfg.standardize;
  const { cfg, order, byName, simple, double, expected, other } = model;
  const picks = order.map(t => {
    const p = byName.get(selection[t]);
    if (!p || !p.types.includes(t)) throw new Error(`Selección inválida en ${t}: ${selection[t]}`);
    return { slot: t, p };
  });

  // Observado de cada tipo secundario y su peso.
  const observed = Object.fromEntries(order.map(t => [t, 0]));
  for (const { slot, p } of picks) if (p.types.length === 2) observed[other(p, slot)] += 1;
  const dev = {}, sec = {};
  for (const t of order) {
    dev[t] = observed[t] - expected[t];
    sec[t] = clamp(cfg.secBase + cfg.secSlope * dev[t], cfg.secMin, cfg.secMax);
  }

  // Contribuciones.
  const chosenIn = new Map();
  for (const { slot, p } of picks) chosenIn.set(p.name, (chosenIn.get(p.name) || []).concat(slot));
  const contribs = [];
  const doubles = [];
  const seenDouble = new Set();
  for (const { slot, p } of picks) {
    const pw = cfg.popWeight[p.popularity];
    const w = cfg.popMode === 'dominance' ? 1 : pw;
    if (p.types.length === 2 && chosenIn.get(p.name).length === 2) {
      if (seenDouble.has(p.name)) continue;
      seenDouble.add(p.name);
      const d = double.get(p.name);
      doubles.push(d);
      for (const t of p.types) contribs.push({ axis: t, pos: d.pos[t], w, pop: pw, pokemon: p.name, kind: 'double' });
      continue;
    }
    contribs.push({ axis: slot, pos: simple.get(p.name + '|' + slot).pos, w, pop: pw, pokemon: p.name, kind: 'primary' });
    if (p.types.length === 2) {
      const u = other(p, slot);
      contribs.push({ axis: u, pos: simple.get(p.name + '|' + u).pos, w: w * sec[u], pop: pw, pokemon: p.name, kind: 'secondary' });
    }
  }

  // Perfil.
  const profile = {};
  for (const t of order) {
    const cs = contribs.filter(c => c.axis === t);
    const sw = cs.reduce((s, c) => s + c.w, 0);
    profile[t] = cs.reduce((s, c) => s + c.w * c.pos, 0) / sw;
  }
  // Polo por posición absoluta (5 es el centro de la escala). Con standardize, la intensidad se mide en
  // desviaciones típicas respecto a la media del eje, y solo cuenta si va en la dirección del polo.
  const dist = t => (std ? (profile[t] - model.stats[t].mean) / model.stats[t].sd : profile[t] - 5);
  const pole = t => (profile[t] >= 5 ? 'high' : 'low');
  const popAxis = {};
  for (const t of order) {
    const cs = contribs.filter(c => c.axis === t && c.kind !== 'secondary');
    popAxis[t] = cs.reduce((s, c) => s + c.pop, 0) / cs.length;
  }
  const baseIntensity = t => {
    const d = dist(t);
    return std && (d >= 0) !== (pole(t) === 'high') ? 0 : Math.abs(d);
  };
  const intensity = t => baseIntensity(t) * (cfg.popMode === 'dominance' ? popAxis[t] : 1);
  const th = std ? cfg.z : { flat: cfg.flatThreshold, third: cfg.thirdAxisThreshold, tension: cfg.tensionPole };
  const ranked = [...order].sort((a, b) => intensity(b) - intensity(a) || order.indexOf(a) - order.indexOf(b));
  const flat = intensity(ranked[0]) < th.flat;
  const archetype = flat ? { key: 'equilibrio' } : {
    key: `${ranked[0]}:${pole(ranked[0])}+${ranked[1]}:${pole(ranked[1])}`,
    poles: [[ranked[0], pole(ranked[0])], [ranked[1], pole(ranked[1])]],
    third: intensity(ranked[2]) >= th.third ? [ranked[2], pole(ranked[2])] : null,
  };

  // Tensiones: entre ejes (por producto de intensidades) y dentro de un eje.
  const found = [];
  const poleIntensity = ([t, side]) => (pole(t) === side ? intensity(t) : 0);
  for (const [i, tn] of model.tensions.entries()) {
    const a = poleIntensity(tn.a), b = poleIntensity(tn.b);
    if (a >= th.tension && b >= th.tension) found.push({ kind: 'axes', index: i, score: a * b, idea: tn.idea });
  }
  found.sort((x, y) => y.score - x.score || x.index - y.index);
  const inner = [];
  for (const t of order) {
    const ps = contribs.filter(c => c.axis === t).map(c => c.pos);
    if (Math.max(...ps) - Math.min(...ps) >= cfg.innerGap) inner.push({ kind: 'inner', axis: t, score: Math.max(...ps) - Math.min(...ps) });
  }
  inner.sort((x, y) => y.score - x.score || order.indexOf(x.axis) - order.indexOf(y.axis));
  const tensions = found.concat(inner).slice(0, cfg.tensionMax);

  // Patrón de tipo secundario.
  const inTop = new Set(flat ? [] : ranked.slice(0, 3));
  const cand = order.filter(t => observed[t] >= cfg.patternMinCount && dev[t] >= cfg.patternMinDev && !inTop.has(t))
    .sort((a, b) => dev[b] - dev[a] || order.indexOf(a) - order.indexOf(b));
  const pattern = cand.length ? { type: cand[0], observed: observed[cand[0]], dev: dev[cand[0]] } : null;

  // Entradas ordenadas por relevancia: peso de popularidad × intensidad de su eje.
  // Las 3 más relevantes (revealing) salen solo de contribuciones completas (principal o doble), no de las de segundo tipo.
  const scored = contribs.map(c => ({ ...c, score: (cfg.popMode === 'dominance' ? 1 : c.pop) * intensity(c.axis) }))
    .sort((a, b) => b.score - a.score || order.indexOf(a.axis) - order.indexOf(b.axis) || (a.kind === 'secondary') - (b.kind === 'secondary'));
  // Una entrada de doble selección aporta a dos ejes pero es un solo texto: se queda con su contribución más relevante.
  const seen = new Set();
  const unique = scored.filter(c => c.kind !== 'double' || (seen.has(c.pokemon) ? false : seen.add(c.pokemon)));
  scored.length = 0; scored.push(...unique);
  const revealing = scored.filter(c => c.kind !== 'secondary').slice(0, 3);

  return { profile, ranked, archetype, tensions, pattern, doubles: doubles.map(d => d.pokemon), revealing, scored, observed, dev, sec, contribs };
}

const TEXT_ES = { connectors: ['Al mismo tiempo,', 'Y a la vez', 'A eso se suma que', 'Junto a eso,'], joiner: 'con', deep: 'De fondo,' };
const cap = s => s[0].toUpperCase() + s.slice(1);

// Título, párrafo y matiz del arquetipo a partir de las frases de los polos ({eje: {low|high: {title, tendency, shadow}}}).
// `text` fija el idioma: conectores, la palabra que une los dos títulos y la fórmula del matiz.
export function archetypeText(poles, archetype, text = TEXT_ES) {
  if (!archetype.poles) return { title: 'Equilibrio', paragraph: '', nuance: '' };
  const [[t1, s1], [t2, s2]] = archetype.poles;
  const p1 = poles[t1][s1], p2 = poles[t2][s2];
  const hash = [...archetype.key].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const conn = text.connectors[hash % text.connectors.length];
  return {
    title: `${p1.title} ${text.joiner} ${p2.title[0].toLowerCase() + p2.title.slice(1)}`,
    paragraph: `${cap(p1.tendency)}. ${conn} ${p2.tendency}. ${p1.shadow}`,
    nuance: archetype.third ? `${text.deep} ${poles[archetype.third[0]][archetype.third[1]].tendency}.` : '',
  };
}

function sprite(name, size) {
  const box = document.createElement('span');
  box.className = 'sprite';
  if (size) { box.style.width = box.style.height = size + 'px'; }
  const img = document.createElement('img');
  img.alt = '';
  img.decoding = 'async';
  img.loading = 'lazy';
  let k = 0;
  img.onload = () => box.classList.add('done');
  img.onerror = () => { if (++k < SPRITE.length) img.src = SPRITE[k](idOf[name]); else box.classList.add('fail'); };
  img.src = SPRITE[0](idOf[name]);
  box.appendChild(img);
  return box;
}

    o.onclick = () => { state[t] = p.name; paintSlot(t); paintStatus(); picker.close(); };
    box.appendChild(o);
  }
  picker.showModal();
  box.querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: 'center' });
}
$('picker-close').onclick = () => picker.close();
picker.addEventListener('click', e => { if (e.target === picker) picker.close(); });

for (const t of model.order) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'slot';
  b.onclick = () => openPicker(t);
  slotBtn[t] = b;
  $('slots').appendChild(b);
}

// Precarga tranquila del resto de sprites cuando el navegador está libre, para que los selectores abran al instante.
const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
function prefetch(names) {
  const batch = names.splice(0, 12);
  for (const n of batch) new Image().src = SPRITE[0](idOf[n]);
  if (names.length) idle(() => prefetch(names));
}
idle(() => prefetch([...new Set(model.order.flatMap(t => model.lists[t].map(p => p.name)))]));

// ---- Iconos pixel art (Pixelarticons, MIT). Se eligen por el texto de la etiqueta, nunca por tipo ni eje, para no revelar de dónde sale cada entrada.
const ICONS = {"moon":"M18 22H8v-2h10v2ZM8 20H6v-2h2v2Zm12 0h-2v-2h2v2ZM6 18H4v-2h2v2Zm16 0h-2v-4h-2v-2h2v-2h2v8ZM4 16H2V6h2v10Zm14 0h-6v-2h6v2Zm-6-2h-2v-2h2v2Zm-2-2H8V6h2v6ZM6 6H4V4h2v2Zm8-2h-2v2h-2V4H6V2h8v2Z","sun":"M13 22h-2v-3h2v3Zm-6-3H5v-2h2v2Zm12 0h-2v-2h2v2Zm-4-2H9v-2h6v2Zm-6-2H7V9h2v6Zm8 0h-2V9h2v6ZM5 13H2v-2h3v2Zm17 0h-3v-2h3v2Zm-7-4H9V7h6v2ZM7 7H5V5h2v2Zm12 0h-2V5h2v2Zm-6-2h-2V2h2v3Z","star":"M5 20H8V22H3V16H5V20ZM21 22H16V20H19V16H21V22ZM10 20H8V18H10V20ZM16 20H14V18H16V20ZM14 18H10V16H14V18ZM7 16H5V13H7V16ZM19 16H17V13H19V16ZM5 13H3V11H5V13ZM21 13H19V11H21V13ZM9 9H3V11H1V7H9V9ZM23 11H21V9H15V7H23V11ZM11 7H9V3H11V7ZM15 7H13V3H15V7ZM13 3H11V1H13V3Z","eye":"M16 20H8v-2h8v2Zm-8-2H4v-2h4v2Zm12 0h-4v-2h4v2ZM4 16H2v-2h2v2Zm10-6h-2v2h2v-2h2v4h-2v2h-4v-2H8v-4h2V8h4v2Zm8 6h-2v-2h2v2ZM2 14H0v-4h2v4Zm22 0h-2v-4h2v4ZM4 10H2V8h2v2Zm18 0h-2V8h2v2ZM8 8H4V6h4v2Zm12 0h-4V6h4v2Zm-4-2H8V4h8v2Z","heart":"M13 22h-2v-2h2v2Zm-2-2H9v-2h2v2Zm4 0h-2v-2h2v2Zm-6-2H7v-2h2v2Zm8 0h-2v-2h2v2ZM7 16H5v-2h2v2Zm12 0h-2v-2h2v2ZM5 14H3v-2h2v2Zm16 0h-2v-2h2v2ZM3 12H1V6h2v6Zm20 0h-2V6h2v6ZM13 8h-2V6h2v2ZM5 6H3V4h2v2Zm6 0H9V4h2v2Zm4 0h-2V4h2v2Zm6 0h-2V4h2v2ZM9 4H5V2h4v2Zm10 0h-4V2h4v2Z","zap":"M4 13h8v6h2v2h-2v2h-2v-8H2v-4h2v2Zm12 6h-2v-2h2v2Zm2-2h-2v-2h2v2Zm2-2h-2v-2h2v2Zm-6-6h8v4h-2v-2h-8V5h-2V3h2V1h2v8Zm-8 2H4V9h2v2Zm2-2H6V7h2v2Zm2-2H8V5h2v2Z","crown":"M3 3h2v12H3zm16 0h2v12h-2zm-8 0h2v2h-2zM9 5h2v2H9zM5 5h2v2H5z M3 3h2v2H3zm4 4h2v2H7zm6-2h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zM5 15h14v2H5zm-2 4h18v2H3z","feather":"M2 20h2v2H2zm6-2h6v2H8zm-2-2h2v2H6zm-2 2h2v2H4zm4-4h2v2H8zm2-2h2v2h-2zm2-2h2v2h-2zm2-2h2v2h-2zm0 8h2v2h-2zm2-2h2v2h-2zm2-2h2v2h-2zm2-6h2v6h-2zm-2-2h2v2h-2zM4 10h2v6H4zm2-2h2v2H6zm2-2h2v2H8zm2-2h2v2h-2zm2-2h6v2h-6z","key":"M11 18H3V16H11V18ZM23 15H21V18H17V16H19V13H21V11H11V8H13V9H23V15ZM3 16H1V8H3V16ZM17 16H15V15H13V16H11V13H17V16ZM9 14H5V10H9V14ZM11 8H3V6H11V8Z","diamond-gem":"M7 1h10v2H7zM5 3h2v2H5zm12 0h2v2h-2zm2 2h2v2h-2zm0 8h2v2h-2zm-2 2h2v2h-2zm-2 2h2v2h-2zm-2 2h2v2h-2zm-2 2h2v2h-2zm-2-2h2v2H9zm-2-2h2v2H7zm-2-2h2v2H5zm-2-2h2v2H3zm0-8h2v2H3zM1 7h2v6H1zm20 0h2v6h-2zM3 9h18v2H3zm6-6h2v3H9zM7 6h2v3H7zm8 0h2v3h-2zm-8 5h2v2H7zm2 2h2v3H9zm2 3h2v3h-2zm2-3h2v3h-2zm2-2h2v2h-2zm-2-8h2v3h-2z","wand":"M14 22H12V20H14V22ZM20 22H18V20H20V22ZM5 19H9V21H3V15H5V19ZM18 20H16V18H18V20ZM22 20H20V18H22V20ZM11 19H9V16H11V19ZM20 18H18V16H20V18ZM13 16H11V13H13V16ZM8 15H5V13H8V15ZM11 13H8V11H11V13ZM15 13H13V11H15V13ZM21 13H19V11H21V13ZM4 12H2V10H4V12ZM13 11H11V9H13V11ZM17 11H15V9H17V11ZM15 9H13V7H15V9ZM19 9H17V7H19V9ZM6 8H4V6H6V8ZM17 7H15V5H17V7ZM21 7H19V5H17V3H21V7ZM4 6H2V4H4V6ZM8 6H6V4H8V6ZM13 5H11V3H13V5ZM6 4H4V2H6V4Z","sparkles":"M11 1h2v4h-2zm0 22h2v-4h-2zM9 5h2v4H9zm0 14h2v-4H9zm4-14h2v4h-2zm0 14h2v-4h-2zM5 9h4v2H5zm14 0h-4v2h4zM1 11h4v2H1zm22 0h-4v2h4zM5 13h4v2H5zm14 0h-4v2h4zm0-12h2v6h-2z M17 3h6v2h-6zM3 17h2v2H3zm-2 2h2v2H1zm2 2h2v2H3zm2-2h2v2H5z","hourglass":"M16 22H8v-2h8v2Zm-8-2H6v-4h2v4Zm10 0h-2v-4h2v4Zm-8-4H8v-2h2v2Zm6 0h-2v-2h2v2Zm-6-6h4v4h-4v-4Zm0 0H8V8h2v2Zm6 0h-2V8h2v2ZM8 8H6V4h2v4Zm10 0h-2V4h2v4Zm-2-4H8V2h8v2Z","compass":"M18 22H6V20H18V22ZM6 20H4V18H6V20ZM20 20H18V18H20V20ZM10 16H12V18H10V19H8V10H10V16ZM4 18H2V6H4V18ZM22 18H20V6H22V18ZM14 16H12V14H14V16ZM16 14H14V8H12V6H14V5H16V14ZM13 13H11V11H13V13ZM12 10H10V8H12V10ZM6 6H4V4H6V6ZM20 6H18V4H20V6ZM18 4H6V2H18V4Z","infinity":"M8 18H4V16H8V18ZM20 18H16V16H20V18ZM4 16H2V14H4V16ZM10 16H8V14H10V16ZM16 16H14V14H16V16ZM22 16H20V14H22V16ZM2 14H0V10H2V14ZM14 14H12V12H14V14ZM24 14H22V10H24V14ZM12 12H10V10H12V12ZM4 10H2V8H4V10ZM10 10H8V8H10V10ZM16 10H14V8H16V10ZM22 10H20V8H22V10ZM8 8H4V6H8V8ZM20 8H16V6H20V8Z","lightbulb":"M9 4h6v2H9zM7 6h2v2H7zm8 0h2v2h-2zm4-2h2v2h-2zm2-2h2v2h-2zM0 10h3v2H0zm21 0h3v2h-3zM3 4h2v2H3zM1 2h2v2H1zm6 12h2v2H7zm8 0h2v2h-2zM5 8h2v6H5zm12 0h2v6h-2zm-8 8h6v2H9zm0 4h6v2H9zm0-2h2v2H9zm4 0h2v2h-2zM11 0h2v3h-2z","fire":"M9 2h2v4H9zM7 6h2v2H7zM5 8h2v2H5zm8 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2zm2 2h2v6h-2zM3 10h2v8H3zm8-4h2v4h-2zm6 12h2v2h-2zM7 20h10v2H7zm-2-2h2v2H5zm4-2h6v4H9z M11 14h2v3h-2z","shield":"M4 2h16v2H4zM2 4h2v10H2zm18 0h2v10h-2zM4 14h2v2H4zm2 2h2v2H6zm4 4h4v2h-4zm10-6h-2v2h2zm-2 2h-2v2h2zm-2 2h-2v2h2zm-6 0H8v2h2z"};
const icon = n => `<svg class="ico" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const ENTRY_ICONS = ['star', 'eye', 'heart', 'sun', 'crown', 'feather', 'key', 'diamond-gem', 'wand', 'hourglass', 'compass', 'lightbulb', 'fire', 'shield'];
function iconFor(label) { let h = 0; for (const ch of label) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ENTRY_ICONS[h % ENTRY_ICONS.length]; }

// ---- Gráficas de estrella: los 15 ejes en 3 grupos de 5. El centro es el primer polo y el borde el segundo.
const GROUPS = [['fuego', 'agua', 'planta', 'hielo', 'roca'], ['veneno', 'tierra', 'psiquico', 'fantasma', 'lucha'], ['electrico', 'volador', 'bicho', 'dragon', 'normal']];
function radar(types, profile, c) {
  const n = types.length, R = 75, C0 = 75;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [C0 + R * v / 10 * Math.cos(ang(i)), C0 + R * v / 10 * Math.sin(ang(i))].map(x => x.toFixed(1)).join(',');
  const ring = v => types.map((_, i) => pt(i, v)).join(' ');
  let svg = '<svg viewBox="0 0 150 150" shape-rendering="crispEdges" aria-hidden="true">';
  for (const v of [2.5, 5, 7.5, 10]) svg += `<polygon points="${ring(v)}" fill="none" stroke="${v === 5 ? '#5b34b8' : '#3b2766'}" stroke-width="${v === 10 ? 2 : 1}"/>`;
  types.forEach((_, i) => svg += `<line x1="${C0}" y1="${C0}" x2="${pt(i, 10).split(',')[0]}" y2="${pt(i, 10).split(',')[1]}" stroke="#3b2766"/>`);
  svg += `<polygon points="${types.map((t, i) => pt(i, profile[t])).join(' ')}" fill="rgba(139,92,246,.45)" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="miter"/>`;
  types.forEach((t, i) => { const [x, y] = pt(i, profile[t]).split(','); svg += `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="#fff"/>`; });
  svg += '</svg>';
  const labels = types.map((t, i) => {
    const a = ang(i), cx = Math.cos(a), cy = Math.sin(a);
    const dx = ((R + 8) * cx).toFixed(0), dy = ((R + 6) * cy).toFixed(0);
    const tx = Math.abs(cx) < .3 ? '-50%' : cx > 0 ? '0' : '-100%', ty = cy < -.3 ? '-100%' : cy > .3 ? '0' : '-50%';
    const ax = c.axis(t);
    return `<span class="lbl" style="left:calc(50% + ${dx}px);top:calc(55% + ${dy}px);transform:translate(${tx},${ty});text-align:${Math.abs(cx) < .3 ? 'center' : cx > 0 ? 'left' : 'right'}" title="${esc(ax.low)} ↔ ${esc(ax.high)}">${esc(ax.name)}</span>`;
  }).join('');
  return svg + labels;
}

// ---- Resultado
let shown = false;
function render(scroll) {
  const r = computeResult(model, { ...state }, { standardize: $('std').checked });
  const u = ui(), c = C();
  const at = archetypeText(c.poles, r.archetype, u.text);
  let h = `<h2>${esc(u.profile)}</h2><div class="card feature">${icon('moon')}<div><p class="arch">${esc(at.title)}</p>`;
  if (at.paragraph) h += `<p>${esc(at.paragraph)}</p>`;
  if (at.nuance) h += `<p>${esc(at.nuance)}</p>`;
  h += '</div></div>';
  if (r.doubles.length) h += `<div class="card feature">${icon('infinity')}<div>${esc(r.doubles.length === 1 ? u.dbl1 : u.dblN(r.doubles.length))}${esc(u.dblTail)}${DEBUG ? ' <span class="muted">[' + r.doubles.map(esc).join(', ') + ']</span>' : ''}</div></div>`;
  const card = x => {
    const e = c.entry(x);
    const dbg = DEBUG ? `<small>${esc(x.pokemon)} · ${esc(c.axis(x.axis).name)} ${x.pos} · ${KIND[x.kind]} · relevance ${x.score.toFixed(2)}</small>` : '';
    return `<div class="card entry">${icon(iconFor(e.label))}<b>${esc(e.label)}</b>${dbg}<p>${esc(e.text)}</p></div>`;
  };
  h += `<h2>${esc(u.most)}</h2>`;
  h += `<div class="cards">${r.revealing.map(card).join('')}</div>`;
  const rest = r.scored.filter(x => !r.revealing.includes(x));
  if (rest.length) h += `<details><summary class="muted">${esc(u.all(rest.length))}</summary><div class="cards">${rest.map(card).join('')}</div></details>`;
  h += `<h2>${esc(u.tensions)}</h2>`;
  if (!r.tensions.length) h += `<p class="muted">${esc(u.noTension)}</p>`;
  const tcards = r.tensions.map(tn => `<div class="card">${icon('zap')}<p>${esc(tn.kind === 'axes' ? c.tension(tn.index) : u.inner(c.axis(tn.axis).name))}</p></div>`);
  if (r.pattern) tcards.push(`<div class="card">${icon('sparkles')}<p>${esc(u.pattern(c.type(r.pattern.type), r.pattern.observed, (r.pattern.observed - r.pattern.dev).toFixed(1)))}</p></div>`);
  if (tcards.length) h += `<div class="cards">${tcards.join('')}</div>`;
  h += `<h2>${esc(u.axes)}</h2><div class="cards">${GROUPS.map((g, i) => `<div class="card"><div class="radar-title">${esc(u.groups[i])}</div><div class="radar">${radar(g, r.profile, c)}</div></div>`).join('')}</div>`;
  h += `<details><summary class="muted">${esc(u.byAxis)}</summary><div class="card">`;
  for (const t of model.order) {
    const v = r.profile[t], a = c.axis(t);
    h += `<div class="axis"><div class="poles"><span>${esc(a.low)}</span><span>${esc(a.high)}</span></div><div class="track"><div class="mid"></div><div class="dot" style="left:${v * 10}%;transform:translateX(-${v * 10}%)"></div></div>${DEBUG ? `<div class="muted">${esc(a.name)}: ${v.toFixed(1)}</div>` : ''}</div>`;
  }
  h += '</div></details>';
  if (DEBUG) {
    h += '<details open><summary class="muted">Calculation detail</summary><div class="card"><table><tr><th>Axis</th><th>Pokémon</th><th>Origin</th><th>Pos.</th><th>Weight</th></tr>';
    for (const x of [...r.contribs].sort((p, q) => model.order.indexOf(p.axis) - model.order.indexOf(q.axis))) {
      h += `<tr><td>${esc(c.axis(x.axis).name)}</td><td>${esc(x.pokemon)}</td><td>${KIND[x.kind]}</td><td>${x.pos}</td><td>${x.w.toFixed(2)}</td></tr>`;
    }
    h += '</table></div></details>';
  }
  h += `<div class="go-row"><button class="primary" id="share" type="button">${esc(u.share)}</button><input id="share-url" class="share-url" readonly hidden aria-label="${esc(u.linkLabel)}"><button id="again" type="button">${esc(u.again)}</button></div>`;
  $('out').innerHTML = h;
  $('share').onclick = share;
  $('again').onclick = again;
  $('out').hidden = false;
  if (!DEBUG) history.replaceState(null, '', shareHash());
  shown = true;
  if (scroll) $('out').scrollIntoView({ behavior: 'smooth' });
}

// ---- Compartir
const nameOfId = Object.fromEntries(DATA.pokemon.map(p => [p.id, p.name]));
const shareHash = () => '#s=' + model.order.map(t => idOf[state[t]]).join('.');
const shareUrl = () => location.href.split('#')[0] + shareHash();
function loadHash() {
  const m = HASH_RE.exec(location.hash);
  if (!m) return false;
  const picks = m[1].split('.').map(n => nameOfId[+n]);
  if (!model.order.every((t, i) => picks[i] && model.lists[t].some(p => p.name === picks[i]))) return false;
  model.order.forEach((t, i) => { state[t] = picks[i]; });
  return true;
}
async function share() {
  const u = ui(), url = shareUrl(), btn = $('share');
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ title: u.title, text: u.shareText, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = u.copied;
    setTimeout(() => { btn.textContent = u.share; }, 2000);
  } catch (e) {
    const box = $('share-url'); box.hidden = false; box.value = url; box.focus(); box.select();
  }
}
function again() {
  for (const t of model.order) delete state[t];
  history.replaceState(null, '', location.pathname + location.search);
  $('out').hidden = true; shown = false;
  applyLang();
  $('select').scrollIntoView({ behavior: 'smooth' });
}

// ---- Textos fijos y cambio de idioma
function applyLang() {
  const u = ui();
  document.documentElement.lang = lang;
  document.title = u.title;
  $('t-title').textContent = u.title;
  $('t-tag').textContent = u.tag;
  $('t-intro').textContent = u.intro;
  $('cta').textContent = u.cta;
  $('t-pick').textContent = u.pick;
  $('go').textContent = u.go;
  $('picker-close').textContent = u.close;
  $('legal').innerHTML = u.legal.map(p => `<p>${p}</p>`).join('');
  $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
  $('lang-es').setAttribute('aria-pressed', String(lang === 'es'));
  for (const t of model.order) paintSlot(t);
  paintStatus();
  if (shown) render(false);
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('oracle-lang', l); } catch (e) { /* sin almacenamiento */ }
  if (picker.open) picker.close();
  applyLang();
}
$('lang-en').onclick = () => setLang('en');
$('lang-es').onclick = () => setLang('es');

$('cta').onclick = () => $('select').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
$('go').onclick = () => render(true);

// Partículas de píxel al pasar el ratón por los botones principales.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#8b5cf6'];
  let last = 0;
  for (const b of [$('go'), $('cta')]) b.addEventListener('pointermove', e => {
    if (b.disabled || e.pointerType === 'touch') return;
    const now = performance.now();
    if (now - last < 45) return;
    last = now;
    for (let i = 0; i < 2; i++) {
      const p = document.createElement('i');
      p.className = 'px';
      const sz = 4 + 2 * Math.floor(Math.random() * 2);
      p.style.cssText = `left:${e.clientX - sz / 2}px;top:${e.clientY - sz / 2}px;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random() * colors.length)]};--dx:${Math.round((Math.random() - .5) * 70 / 4) * 4}px;--dy:${Math.round((-10 - Math.random() * 50) / 4) * 4}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  });
}

// Estrellas de píxel del hero: posiciones fijas (generador con semilla) para que no cambien entre cargas.
function stars(el, n, seed, size) {
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const colors = ['#ffffff', '#c4b5fd', '#a78bfa', '#ede9fe'];
  el.style.boxShadow = Array.from({ length: n }, () => `${(rnd() * 100).toFixed(1)}vw ${(rnd() * 100).toFixed(1)}svh 0 ${size}px ${colors[Math.floor(rnd() * colors.length)]}`).join(',');
}
stars($('stars-a'), 70, 5, 0);
stars($('stars-b'), 40, 9, 1);
if (DEBUG) {
  $('debug-tools').hidden = false;
  $('rand').onclick = () => {
    for (const t of model.order) { const l = model.lists[t]; state[t] = l[Math.floor(Math.random() * l.length)].name; }
    applyLang(); render(true);
  };
}
if (!DEBUG && loadHash()) {
  applyLang(); render(false);
  requestAnimationFrame(() => $('out').scrollIntoView({ behavior: 'auto' }));
} else applyLang();
addEventListener('hashchange', () => { if (!DEBUG && loadHash()) { applyLang(); render(true); } });
</script>
