<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0713">
<title>Pokémon Oracle</title>
<meta name="description" content="What does your Pokémon selection say about you? Pick your favourite Pokémon of each Kanto type and read your profile.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pokémon Oracle">
<meta property="og:description" content="What does your Pokémon selection say about you?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0713; --surface:#150d24; --surface2:#1d1233; --edge:#000; --line:#3b2766;
    --fg:#ece8f7; --muted:#a398c2; --accent:#8b5cf6; --accent-hi:#a78bfa; --accent-lo:#5b34b8; --glow:#c4b5fd;
    --display:'Silkscreen', ui-monospace, 'Courier New', monospace;
    --text:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --hero-img: none;
  }
  :root {  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 var(--text); }
  h1, h2, h3, .display { font-family:var(--display); font-weight:700; letter-spacing:.04em; }
  h2 { font-size:1.1rem; margin:36px 4px 10px; color:var(--glow); text-transform:uppercase; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent-hi); }

  /* Pixel UI: bordes escalonados con box-shadow, sin esquinas redondeadas */
  button { font-family:var(--display); font-weight:700; letter-spacing:.05em; font-size:.8rem; border:0; border-radius:0; cursor:pointer;
    padding:12px 18px 16px; line-height:1.2; margin:4px; color:var(--fg); background:var(--surface2);
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
               inset -4px -4px 0 0 rgba(0,0,0,.4), inset 4px 4px 0 0 rgba(255,255,255,.12); }
  button:hover { background:var(--accent-lo); }
  button:active { transform:translateY(2px); box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 4px 4px 0 0 rgba(0,0,0,.4); }
  button:focus-visible { outline:3px dashed var(--glow); outline-offset:6px; }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-hi); color:#0b0713; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; background:var(--surface2); }
  button:disabled:hover { background:var(--surface2); color:var(--fg); }
  .card { background:var(--surface); margin:16px 4px; padding:16px 18px;
    box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 0 0 2px var(--line); }
  .card p { margin:6px 0 0; }

  /* Hero */
  .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:96px 20px 72px; overflow:hidden; isolation:isolate;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(139,92,246,.35), transparent 70%),
      linear-gradient(180deg, rgba(11,7,19,.35), rgba(11,7,19,.88) 85%, var(--bg)),
      var(--hero-img) center/cover no-repeat,
      linear-gradient(180deg, #120a24, var(--bg)); }
  .stars { position:absolute; top:0; left:0; width:2px; height:2px; background:transparent; z-index:-1; animation:twinkle 4s steps(2) infinite; }
  .stars.b { animation-duration:6s; animation-delay:-2s; }
  @keyframes twinkle { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .stars { animation:none; } }
  .lang { position:absolute; top:16px; right:16px; display:flex; }
  .lang button { padding:8px 12px 11px; font-size:.7rem; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .hero h1 { font-size:clamp(2.2rem, 9vw, 4.5rem); line-height:1.05; margin:0 0 20px; color:#fff; text-shadow:0 0 24px rgba(167,139,250,.75), 4px 4px 0 #3a1d7a; }
  .tagline { font-family:var(--display); font-size:clamp(.85rem, 2.6vw, 1.15rem); color:var(--glow); margin:0 0 18px; text-transform:uppercase; letter-spacing:.08em; }
  .intro { max-width:560px; margin:0 auto 34px; color:var(--fg); opacity:.88; }
  .scroll-hint { margin-top:28px; color:var(--muted); font-family:var(--display); font-size:.7rem; letter-spacing:.1em; animation:bob 1.6s steps(2) infinite; }
  @keyframes bob { 50% { transform:translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .scroll-hint { animation:none; } }

  main { max-width:980px; margin:0 auto; padding:56px 16px 64px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:18px 14px; margin:18px 0 26px; }
  @media (max-width:820px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2,1fr); } }
  #t-pick { text-align:center; }
  button.slot { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px 10px; margin:4px; text-align:center; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.slot:hover, button.opt:hover { background:var(--accent-lo); }
  .slot .type { font-family:var(--display); font-size:.68rem; color:var(--glow); text-transform:uppercase; letter-spacing:.08em; }
  .slot .pname, .opt .pname { font-size:.82rem; line-height:1.2; }
  .slot.empty .pname { color:var(--muted); }
  .sprite { position:relative; width:96px; height:96px; background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%); background-size:200% 100%; animation:shimmer 1.2s steps(8) infinite; }
  .sprite.done { animation:none; background:none; }
  .sprite.blank { animation:none; background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:2rem; color:var(--accent-hi); box-shadow:inset 0 0 0 2px var(--line); }
  .sprite img { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; opacity:0; transition:opacity .2s; }
  .sprite.done img { opacity:1; }
  .sprite.fail { animation:none; background:var(--surface); }
  @keyframes shimmer { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sprite { animation:none; } }
  dialog { width:min(740px,94vw); max-height:88vh; padding:0; border:0; background:var(--bg); color:var(--fg);
    box-shadow:0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
  dialog::backdrop { background:rgba(5,2,12,.78); }
  dialog header { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border-bottom:2px solid var(--line); z-index:1; }
  dialog h3 { margin:0; font-size:.95rem; color:var(--glow); text-transform:uppercase; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:14px 10px; padding:16px; }
  button.opt { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; font-family:var(--text); font-weight:500; letter-spacing:0; }
  button.opt[aria-pressed="true"] { background:var(--accent-lo); box-shadow:0 -4px 0 0 var(--glow), 0 4px 0 0 var(--glow), -4px 0 0 0 var(--glow), 4px 0 0 0 var(--glow); }
  button.opt .sprite { width:80px; height:80px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .go-row { display:flex; flex-direction:column; align-items:center; gap:10px; margin:30px 0 8px; }
  .go-row button { padding:16px 28px 20px; font-size:.95rem; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:22px 18px; margin:16px 0; }
  .cards .card { margin:4px; display:flex; flex-direction:column; gap:8px; }
  .cards.wide { grid-template-columns:1fr; }
  .card.feature { display:flex; gap:18px; align-items:flex-start; background:linear-gradient(135deg,var(--surface2),var(--surface)); }
  .ico { flex:none; width:24px; height:24px; color:var(--glow); filter:drop-shadow(0 0 6px var(--accent)); }
  .card .ico + * { margin-top:0; }
  @media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .cards { grid-template-columns:1fr; } .card.feature { flex-direction:column; } }
  .radar { position:relative; height:210px; }
  .radar svg { position:absolute; left:50%; top:55%; width:150px; height:150px; transform:translate(-50%,-50%); overflow:visible; }
  .radar .lbl { position:absolute; max-width:84px; font-size:.7rem; line-height:1.15; color:var(--muted); }
  .radar-title { font-family:var(--display); font-size:.85rem; color:var(--glow); text-transform:uppercase; letter-spacing:.06em; text-align:center; }
  .share-url { width:min(420px,90%); padding:8px; font:.8rem var(--text); color:var(--fg); background:var(--bg); border:2px solid var(--line); }
  .px { position:fixed; width:6px; height:6px; pointer-events:none; z-index:50; animation:pxfly .7s steps(7) forwards; }
  @keyframes pxfly { to { transform:translate(var(--dx),var(--dy)); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .px { display:none; } }
  .arch { font-family:var(--display); font-size:clamp(1.15rem,4.5vw,1.6rem); line-height:1.25; margin:0 !important; color:#fff; text-shadow:0 0 14px rgba(167,139,250,.6); }
  .axis { margin:16px 0; }
  .poles { display:flex; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--muted); }
  .track { position:relative; height:10px; margin-top:8px; background:var(--surface2); box-shadow:inset 0 0 0 2px var(--line); }
  .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--muted); }
  .dot { position:absolute; top:-5px; width:16px; height:20px; background:var(--accent-hi); box-shadow:0 0 0 2px #000, 0 0 10px var(--accent); }
  details > summary { cursor:pointer; margin:16px 4px 8px; padding:8px 0; }
  .entry b { display:block; font-family:var(--display); font-size:.95rem; color:var(--glow); letter-spacing:.03em; }
  .entry small { color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:.85rem; } td,th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  .legal { max-width:860px; margin:0 auto; padding:32px 16px 48px; border-top:2px solid var(--line); font-size:.8rem; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<section class="hero" id="hero">
  <i class="stars" id="stars-a"></i><i class="stars b" id="stars-b"></i>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" id="lang-es" aria-pressed="false">ES</button>
  </div>
  <h1 id="t-title"></h1>
  <p class="tagline" id="t-tag"></p>
  <p class="intro" id="t-intro"></p>
  <button type="button" class="primary" id="cta"></button>
  <span class="scroll-hint" aria-hidden="true">▼</span>
</section>
<main id="select">
  <h2 id="t-pick"></h2>
  <div class="grid" id="slots"></div>
  <dialog id="picker"><header><h3 id="picker-title"></h3><button id="picker-close" type="button"></button></header><div class="opts" id="opts"></div></dialog>
  <div class="go-row">
    <button class="primary" id="go" disabled></button>
    <span class="muted" id="count"></span>
  </div>
  <div class="row" id="debug-tools" hidden>
    <button id="rand" type="button">Random (debug)</button>
    <label class="muted"><input type="checkbox" id="std" checked> Normalize axes</label>
  </div>
  <div id="out" hidden></div>
</main>
<footer class="legal" id="legal"></footer>

"name":"Rhyhorn","popularity":2,"types":["tierra","roca"]},{"id":112,"name":"Rhydon","popularity":2,"types":["tierra","roca"]},{"id":113,"name":"Chansey","popularity":3,"types":["normal"]},{"id":114,"name":"Tangela","popularity":2,"types":["planta"]},{"id":115,"name":"Kangaskhan","popularity":2,"types":["normal"]},{"id":116,"name":"Horsea","popularity":2,"types":["agua"]},{"id":117,"name":"Seadra","popularity":2,"types":["agua"]},{"id":118,"name":"Goldeen","popularity":1,"types":["agua"]},{"id":119,"name":"Seaking","popularity":1,"types":["agua"]},{"id":120,"name":"Staryu","popularity":2,"types":["agua"]},{"id":121,"name":"Starmie","popularity":3,"types":["agua","psiquico"]},{"id":122,"name":"Mr. Mime","popularity":3,"types":["psiquico"]},{"id":123,"name":"Scyther","popularity":4,"types":["volador","bicho"]},{"id":124,"name":"Jynx","popularity":3,"types":["hielo","psiquico"]},{"id":125,"name":"Electabuzz","popularity":2,"types":["electrico"]},{"id":126,"name":"Magmar","popularity":2,"types":["fuego"]},{"id":127,"name":"Pinsir","popularity":2,"types":["bicho"]},{"id":128,"name":"Tauros","popularity":2,"types":["normal"]},{"id":129,"name":"Magikarp","popularity":3,"types":["agua"]},{"id":130,"name":"Gyarados","popularity":4,"types":["agua","volador"]},{"id":131,"name":"Lapras","popularity":4,"types":["agua","hielo"]},{"id":132,"name":"Ditto","popularity":3,"types":["normal"]},{"id":133,"name":"Eevee","popularity":5,"types":["normal"]},{"id":134,"name":"Vaporeon","popularity":3,"types":["agua"]},{"id":135,"name":"Jolteon","popularity":3,"types":["electrico"]},{"id":136,"name":"Flareon","popularity":3,"types":["fuego"]},{"id":137,"name":"Porygon","popularity":3,"types":["normal"]},{"id":138,"name":"Omanyte","popularity":2,"types":["agua","roca"]},{"id":139,"name":"Omastar","popularity":2,"types":["agua","roca"]},{"id":140,"name":"Kabuto","popularity":2,"types":["agua","roca"]},{"id":141,"name":"Kabutops","popularity":3,"types":["agua","roca"]},{"id":142,"name":"Aerodactyl","popularity":3,"types":["volador","roca"]},{"id":143,"name":"Snorlax","popularity":5,"types":["normal"]},{"id":144,"name":"Articuno","popularity":3,"types":["hielo","volador"]},{"id":145,"name":"Zapdos","popularity":3,"types":["electrico","volador"]},{"id":146,"name":"Moltres","popularity":3,"types":["fuego","volador"]},{"id":147,"name":"Dratini","popularity":3,"types":["dragon"]},{"id":148,"name":"Dragonair","popularity":3,"types":["dragon"]},{"id":149,"name":"Dragonite","popularity":5,"types":["volador","dragon"]},{"id":150,"name":"Mewtwo","popularity":5,"types":["psiquico"]},{"id":151,"name":"Mew","popularity":5,"types":["psiquico"]}],"catalog":{"simple":[{"pokemon":"Snorlax","type":"normal","pos":10,"label":"Plenitud sin prisa","text":"Sabes parar. Tu mejor plan es descansar bien, disfrutar de la mesa y que nadie te apresure, y lo defiendes con una calma que no se mueve ni a empujones. El precio: una pausa que se alarga más de lo que te conviene."},{"pokemon":"Rattata","type":"normal","pos":9,"label":"Resistencia sin alardes","text":"Te adaptas a cualquier sitio y te apañas con lo que hay. No necesitas que te noten para sentirte en tu lugar. Lo que no siempre llega es el reconocimiento que mereces."},{"pokemon":"Pidgey","type":"normal","pos":9,"label":"Cerca del suelo, a gusto","text":"Prefieres lo pequeño y conocido a lo vistoso: tu barrio, tus costumbres, tu gente de siempre. Ahí encuentras una paz que otros buscan lejos. Tu límite es lo cómodo."},{"pokemon":"Raticate","type":"normal","pos":8,"label":"Constancia de andar por casa","text":"Lo tuyo es la firmeza cotidiana: hacer lo que toca, un día tras otro, sin esperar aplausos. Sin épica, pero te echarían de menos en cuanto faltaras."},{"pokemon":"Chansey","type":"normal","pos":8,"label":"Generosidad discreta","text":"Das sin hacer ruido. Tu ayuda es silenciosa y constante, y lo que de verdad te importa es que la otra persona esté bien. El riesgo: acabar sin energía para ti."},{"pokemon":"Kangaskhan","type":"normal","pos":7,"label":"Protección de fondo","text":"Cargas con los tuyos, en lo práctico y en lo emocional, y tu sencillez es la del cuidado de cada día. Cuando alguien toca a los tuyos, la calma desaparece."},{"pokemon":"Lickitung","type":"normal","pos":7,"label":"Curiosidad sin filtro","text":"Lo pruebas todo, aunque te salga torpe. Tu manera de estar es directa y sincera, y no te preocupa parecer raro. A cambio, rara vez piensas antes de probar."},{"pokemon":"Doduo","type":"normal","pos":7,"label":"Paso compartido","text":"Funcionas bien con una rutina clara y alguien que corra a tu lado. Prefieres la compañía y el paso firme a inventarte atajos, aunque eso te deje sin sorpresas."},{"pokemon":"Pidgeotto","type":"normal","pos":7,"label":"Más alto, sin cambiar","text":"Empiezas a ver más lejos y a que se te note, pero sigues siendo de las personas que prefieren hacer a presumir. Estás aprendiendo cuánta atención soportas."},{"pokemon":"Wigglytuff","type":"normal","pos":6,"label":"Suavidad con peso","text":"Te gusta lo blando, lo cálido y lo agradable, y lo cultivas con gusto. Tienes más carácter del que aparentas, y se nota cuando alguien intenta quitarte lo tuyo."},{"pokemon":"Ditto","type":"normal","pos":6,"label":"Sin forma fija","text":"Te adaptas a cada situación hasta casi desaparecer en ella, y no sientes la necesidad de ser una sola cosa. La pregunta es si, tras tantos disfraces, recuerdas cuál era la tuya."},{"pokemon":"Eevee","type":"normal","pos":6,"label":"Todas las puertas abiertas","text":"Tienes potencial de sobra y aún no has decidido en qué convertirlo, y te gusta así. Mientras tanto disfrutas de lo sencillo y de que te quieran tal como estás."},{"pokemon":"Pidgeot","type":"normal","pos":4,"label":"Brillar con naturalidad","text":"Tienes presencia sin buscarla: cuando te lanzas, se te nota. Disfrutas del reconocimiento sin perseguirlo. Tu equilibrio está en saber cuándo volver a casa."},{"pokemon":"Dodrio","type":"normal","pos":4,"label":"Corriendo con orgullo","text":"Tu sencillez tiene carácter: haces las cosas rápido y bien, y te gusta que se vea. Tienes mil opiniones y aun así avanzas. Quizá te falta alguien que te diga que ya llegaste."},{"pokemon":"Clefable","type":"normal","pos":3,"label":"Rareza discreta","text":"Resultas difícil de ver, y no por casualidad: apareces cuando quieres y como quieres. Tu rareza es tuya, no un espectáculo. Casi nadie llega a conocerla entera."},{"pokemon":"Porygon","type":"normal","pos":3,"label":"Fuera de catálogo","text":"No encajas del todo en ninguna casilla y no te molesta. Lo tuyo es lo curioso y lo que nadie esperaba, y por debajo hay más afecto del que reconoces."},{"pokemon":"Spearow","type":"normal","pos":3,"label":"Carácter en pequeño","text":"Tienes mucho temperamento en poco espacio. Necesitas que te respeten y respondes antes de pensar. Debajo hay alguien que solo quiere que lo tomen en serio."},{"pokemon":"Meowth","type":"normal","pos":2,"label":"Ojo para el brillo","text":"Siempre buscas la oportunidad, y te atrae lo que reluce: el dinero, el estilo, la jugada ingeniosa. Tu encanto es la agudeza con gracia. Lo que reluce no siempre vale lo que parece."},{"pokemon":"Fearow","type":"normal","pos":2,"label":"Dominar el terreno","text":"Quieres altura y que te vean. Tienes claro qué es lo tuyo y no cedes un metro, ni cuando convendría hacerlo. Aterrizar y bajar la guardia es tu asignatura."},{"pokemon":"Clefairy","type":"normal","pos":2,"label":"Magia de otro sitio","text":"Atraes por la rareza, un poco de misterio y algo mágico. Te gusta ser alguien que no se explica del todo, aunque a veces eso te deje sin que nadie te entienda."},{"pokemon":"Tauros","type":"normal","pos":1,"label":"Embestir para demostrar","text":"Necesitas moverte con fuerza para sentir que existes: empuje, voluntad y ganas de que se note. Admiras lo que hace ruido. Lo que te falta es quietud, y no la buscas."},{"pokemon":"Farfetch'd","type":"normal","pos":1,"label":"Singularidad elegida","text":"Cultivas tu rareza con orgullo, aunque cueste: tus reglas, tu manera, tu rumbo. Tienes algo único porque lo has decidido. Compartirlo con alguien lo haría más fácil de sostener."},{"pokemon":"Persian","type":"normal","pos":0,"label":"Elegancia consciente","text":"Sabes cómo te ven y lo cuidas. Tu estilo es un trabajo diario, y no te conformas con pasar desapercibido. Tras tanta imagen, merece la pena preguntarte cuándo descansas de ella."},{"pokemon":"Jigglypuff","type":"normal","pos":0,"label":"Escenario propio","text":"Necesitas público, aunque no siempre te atienda. Te expresas a tu manera aunque no te escuchen, y si no te escuchan, te molestas. Detrás hay ganas de que alguien se quede."},{"pokemon":"Dratini","type":"dragon","pos":0,"label":"Potencial en silencio","text":"Llevas dentro algo grande que aún no ha salido. Vives bien con lo que eres ahora, y cada etapa es un paso que das sin prisa. No necesitas demostrarlo, solo que te dejen crecer."},{"pokemon":"Dragonair","type":"dragon","pos":6,"label":"Poder sereno","text":"Tu fuerza está en la elegancia: ambición cultivada, sin aspavientos. Sabes que llegarás, y te importa cómo. Cuidar tanto la forma puede frenarte antes de empezar."},{"pokemon":"Dragonite","type":"dragon","pos":10,"label":"Grandeza con corazón","text":"Aspiras a algo grande y, cuando llegas, lo usas para ayudar. Tu ambición es generosa: quieres crecer para que quepan los demás. Cuesta que reconozcas lo grande que ya eres."},{"pokemon":"Vulpix","type":"fuego","pos":0,"label":"Calidez de brasa","text":"Tu calor es suave y se nota de cerca. Prefieres dar tiempo y cuidar el ambiente a levantar la voz. Rara vez te enfadas, pero cuando ocurre, tardas en olvidarlo."},{"pokemon":"Ninetales","type":"fuego","pos":1,"label":"Calma con memoria","text":"Tu serenidad es profunda y un poco enigmática. Guardas lo que sientes y lo dejas salir a tu ritmo. Lo que te hacen no se te olvida, aunque no lo digas."},{"pokemon":"Flareon","type":"fuego","pos":2,"label":"Calor de hogar","text":"Tu intensidad es acogedora: das calor sin quemar. Te implicas con afecto y constancia, y evitas los fuegos artificiales. Lo que no sueles mostrar es tu enfado, y se queda dentro."},{"pokemon":"Charmander","type":"fuego","pos":4,"label":"Ganas de crecer","text":"Tienes empuje y mucho entusiasmo por demostrar de qué eres capaz. Tu energía crece con cada reto. Aún aprendes a medir cuándo apretar y cuándo soltar."},{"pokemon":"Arcanine","type":"fuego","pos":5,"label":"Fuerza con nobleza","text":"Tu intensidad tiene dirección: sabes lo que defiendes y lo haces con dignidad. Inspiras respeto sin imponerlo. Cuando te comprometes, lo haces entero, y retirarte cuesta."},{"pokemon":"Moltres","type":"fuego","pos":6,"label":"Renacer con orgullo","text":"Pones el cuerpo y el alma en lo que haces, y sabes volver a empezar tras una caída. Tu orgullo es tu motor y tu peso. Pedir que te sostengan es lo último que harías."},{"pokemon":"Growlithe","type":"fuego","pos":6,"label":"Entusiasmo leal","text":"Te lanzas de cabeza por quienes quieres. Tu vehemencia es afecto sin filtro y no sabes disimular lo que sientes. Reaccionas antes de preguntar, y eso te cuesta algún malentendido."},{"pokemon":"Ponyta","type":"fuego","pos":6,"label":"Ímpetu libre","text":"Te mueves por impulso y necesitas espacio para correr hacia lo que te atrae. Tu entusiasmo es contagioso. Frenar, aunque sepas que conviene, es lo que menos te sale."},{"pokemon":"Charmeleon","type":"fuego","pos":8,"label":"Orgullo en tensión","text":"Estás en una etapa de calor difícil: más fuerza, más carácter, menos paciencia. Quieres ganar y que se note. Tu enfado llega rápido, pero se va tarde."},{"pokemon":"Rapidash","type":"fuego","pos":8,"label":"Velocidad con estilo","text":"Persigues lo que quieres con brío y elegancia. Te gusta la ovación, pero la ganas moviéndote. Detenerte te resulta casi imposible, incluso cuando ya has llegado."},{"pokemon":"Charizard","type":"fuego","pos":9,"label":"Poder que se nota","text":"Tu intensidad es total y orgullosa: cuando sientes algo, el entorno lo nota. Te mueve el desafío y la grandeza. Quien solo quería acercarse puede salir con las manos quemadas."},{"pokemon":"Magmar","type":"fuego","pos":10,"label":"Temperamento volcánico","text":"Vives al máximo y sin filtro: pasiones enormes, enfados enormes, ganas enormes. Aportas energía a cualquier grupo. Necesitas aprender que no todo requiere una explosión."},{"pokemon":"Cloyster","type":"agua","pos":0,"label":"Puertas cerradas","text":"Cierras filas cuando algo te afecta. Tu intimidad está bien protegida y pocas personas entran. Por dentro sientes mucho; el reto es dejar que alguien lo vea."},{"pokemon":"Kabutops","type":"agua","pos":0,"label":"Frialdad precisa","text":"Resuelves con precisión y sin dramatismo. Tus emociones existen, pero las tratas como un asunto privado y técnico. Por eso los demás te malinterpretan."},{"pokemon":"Kingler","type":"agua","pos":1,"label":"Fuerza que no se explica","text":"Prefieres hacer a decir. Tu emoción se expresa en actos contundentes, rara vez en palabras. Los demás tardan en entender lo mucho que te importa."},{"pokemon":"Slowpoke","type":"agua","pos":1,"label":"Sin prisa ni drama","text":"Procesas todo con calma, tanta que la emoción llega tarde. Nada te sacude a primera hora, y eso tranquiliza a los demás. El coste es reaccionar cuando el momento ya pasó."},{"pokemon":"Shellder","type":"agua","pos":1,"label":"Reserva por defecto","text":"Tu primer reflejo es protegerte. Hablas poco de lo que sientes y esperas a tener confianza. Una vez dentro, la gente descubre más de lo que esperaba."},{"pokemon":"Starmie","type":"agua","pos":1,"label":"Brillo distante","text":"Proyectas algo hermoso y difícil de alcanzar. Controlas lo que enseñas, y lo que no enseñas es mucho. Te admiran más de lo que te conocen."},{"pokemon":"Kabuto","type":"agua","pos":1,"label":"Aguante silencioso","text":"Has pasado por mucho sin decir nada. Tu emoción va por dentro y rara vez se nota. Cuando la sacas, sorprende por lo honda que es."},{"pokemon":"Blastoise","type":"agua","pos":2,"label":"Solidez que cuida","text":"Te muestras fuerte y fiable, y mantienes tus emociones bajo control. Los demás se apoyan en ti sin saber lo que cargas, y tú no se lo cuentas."},{"pokemon":"Poliwrath","type":"agua","pos":2,"label":"Sentir a través del esfuerzo","text":"Canalizas lo que sientes en esfuerzo: entrenar, sudar, resolver. Llevas la emoción al terreno de la acción, donde te sientes a salvo. Ponerle palabras es lo difícil."},{"pokemon":"Slowbro","type":"agua","pos":2,"label":"Carga compartida","text":"Llevas a cuestas algo que te acompaña y te pesa, y lo toleras con calma. Tu serenidad es en parte resignación. Aflojar lo que arrastras te sentaría bien."},{"pokemon":"Krabby","type":"agua","pos":2,"label":"Dureza por fuera","text":"Tienes una defensa práctica y un carácter testarudo. Muestras poco, y lo que muestras es más tosco de lo que sientes. Por dentro hay más ternura de la que aparentas."},{"pokemon":"Staryu","type":"agua","pos":2,"label":"Emoción en otro idioma","text":"Sientes de una manera que otros no siempre entienden. Tu calma aparente esconde una vida interior con su propio código. Traducirlo es lo que cuesta."},{"pokemon":"Tentacruel","type":"agua","pos":2,"label":"Aguas con cuidado","text":"Proteges lo que sientes con barreras eficaces. Quien se acerca sin permiso lo nota enseguida. Con quien se lo gana, tu generosidad es enorme."},{"pokemon":"Omastar","type":"agua","pos":2,"label":"Emoción de fondo","text":"Lo que sientes se asienta despacio y se queda. Casi nada te remueve de golpe, pero lo que cala, cala para siempre. Revisitar tu pasado cuesta y, cuando lo haces, te enriquece."},{"pokemon":"Wartortle","type":"agua","pos":3,"label":"Calma con recursos","text":"Sabes mantener la compostura y salir a flote. Compartes tus sentimientos con quienes te inspiran confianza, y esa lista es corta. Es cuestión de tiempo más que de ganas."},{"pokemon":"Squirtle","type":"agua","pos":3,"label":"Confianza ganada","text":"Tienes un lado alegre y un lado prudente. Muestras emoción con quien te cae bien y te repliegas si te la toman a mal. Tu seguridad llega cuando te sabes querido."},{"pokemon":"Golduck","type":"agua","pos":3,"label":"Fluidez con control","text":"Te mueves con soltura entre emociones y sabes mantenerlas a raya. Tu elegancia está en la calma. Un mal día lo tiene cualquiera, y tú prefieres que no se note."},{"pokemon":"Omanyte","type":"agua","pos":3,"label":"Sensibilidad recogida","text":"Sientes mucho, pero lo guardas cerca. Te abres despacio y en la distancia corta. Es tu manera de proteger lo que importa, aunque te deje a solas con ello."},{"pokemon":"Poliwhirl","type":"agua","pos":4,"label":"A medio camino","text":"Equilibras bien lo que sientes y lo que enseñas. Te adaptas al ambiente sin perder tu centro. Cuidado: el equilibrio puede ser, en el fondo, una forma de no decidir."},{"pokemon":"Seadra","type":"agua","pos":4,"label":"Delicadeza con defensas","text":"Eres sensible y lo defiendes con discreción. Te conmueves, pero sin ceder terreno. Las emociones te interesan más de lo que admites."},{"pokemon":"Dewgong","type":"agua","pos":6,"label":"Serenidad cálida","text":"Transmites calma y cercanía. Tus emociones fluyen sin sobresaltos y los demás se sienten a gusto contigo. Lo difícil es enfadarte a tiempo cuando toca."},{"pokemon":"Horsea","type":"agua","pos":6,"label":"Atención al detalle","text":"Te afectan los detalles. Percibes lo que otros pasan por alto y reaccionas con ternura. Necesitas aprender a no cargar con todo lo que notas."},{"pokemon":"Tentacool","type":"agua","pos":6,"label":"Sensor emocional","text":"Captas el estado de ánimo del entorno antes que nadie. Tu sensibilidad funciona como un termómetro. El riesgo es absorber lo que no es tuyo."},{"pokemon":"Seaking","type":"agua","pos":6,"label":"Presencia que se expone","text":"Muestras con orgullo lo que sientes y no tienes miedo de que se vea. Tu emoción es parte de tu estilo, y a veces eso te expone más de lo que pensabas."},{"pokemon":"Poliwag","type":"agua","pos":6,"label":"Emoción en vaivén","text":"Te agitas con facilidad y tu humor sube y baja con el entorno. Sientes con entusiasmo y sin demasiados filtros. Después te calmas y vuelves a empezar."},{"pokemon":"Seel","type":"agua","pos":7,"label":"Cariño juguetón","text":"Muestras afecto con naturalidad y te gusta el juego. Tu emoción es contagiosa y cercana. Cuando algo te pesa, te cuesta estar a solas con ello."},{"pokemon":"Goldeen","type":"agua","pos":7,"label":"Ligereza expresiva","text":"Dejas que se te note lo que sientes y lo haces con gracia. Te mueves entre emociones con soltura. Tanta ligereza puede impedir que te quedes en una el tiempo suficiente."},{"pokemon":"Psyduck","type":"agua","pos":8,"label":"Mente desbordada","text":"Sientes tanto que a veces te desconcierta. Las emociones te llegan en oleadas y te cuesta ordenarlas. Tu bondad se nota; tu desconcierto, también."},{"pokemon":"Vaporeon","type":"agua","pos":8,"label":"Corriente que se adapta","text":"Te adaptas a cada ánimo y a cada persona sin perder profundidad. Tu emoción fluye con facilidad y acompaña. Necesitas espacio propio para no diluirte."},{"pokemon":"Magikarp","type":"agua","pos":8,"label":"Todo a flor de piel","text":"Vives los fracasos y las alegrías con intensidad y sin ocultarlo. Te esfuerzas aunque nadie lo vea. Tu sensibilidad es tu gran potencial, y también donde más te duele."},{"pokemon":"Lapras","type":"agua","pos":9,"label":"Empatía que acompaña","text":"Sientes con los demás y lo expresas con calidez. Eres de las personas que escuchan y acompañan en los momentos difíciles. Tu emoción es generosa, y también te agota."},{"pokemon":"Gyarados","type":"agua","pos":10,"label":"Marea desatada","text":"Lo que sientes sale entero y sin frenos. Pasas de la calma a la tormenta en poco tiempo. Tienes mucho que ofrecer y mucho que aprender a encauzar."},{"pokemon":"Magneton","type":"electrico","pos":0,"label":"Orden atractivo","text":"Tu ritmo es sereno y organizado, y atraes por coherencia, no por ruido. Prefieres un orden estable a la agitación. Cuando todos corren, acelerar te cuesta."},{"pokemon":"Magnemite","type":"electrico","pos":1,"label":"Ritmo constante","text":"Funcionas con un ritmo tranquilo y continuo. No haces mucho ruido, pero siempre estás en marcha. Las prisas te sacan de tu frecuencia."},{"pokemon":"Raichu","type":"electrico","pos":3,"label":"Carga acumulada","text":"Tienes una energía contenida que se nota cuando hace falta. Hay potencia detrás de tu simpatía. Te sienta bien soltar de vez en cuando; acumularla demasiado pesa."},{"pokemon":"Zapdos","type":"electrico","pos":4,"label":"Tormenta con intención","text":"Tu energía llega en rachas poderosas y bien dirigidas. Pasas de la calma al relámpago en un segundo. Eliges tus momentos, y eso impone y también distancia."},{"pokemon":"Electabuzz","type":"electrico","pos":5,"label":"Competitividad en marcha","text":"Necesitas tensión y metas para activarte. Rindes mejor con un reto cerca y con alguien a quien superar. Descansar, sin esa tensión, se vuelve incómodo."},{"pokemon":"Pikachu","type":"electrico","pos":8,"label":"Chispa contagiosa","text":"Tu energía alegra el ambiente. Entras en una sala y sube el ánimo de todos. Recargar es tu asunto pendiente: te agotas antes de lo que admites."},{"pokemon":"Jolteon","type":"electrico","pos":8,"label":"Velocidad nerviosa","text":"Piensas, hablas y reaccionas a una velocidad que a otros les cuesta seguir. Estar en reposo es un esfuerzo. Tu reto es que la rapidez no se convierta en ansiedad."},{"pokemon":"Voltorb","type":"electrico","pos":9,"label":"Siempre al límite","text":"Vas siempre al límite de tu carga. Tu energía es explosiva y a veces impredecible. Lo que parece quietud en ti es tensión acumulada."},{"pokemon":"Electrode","type":"electrico","pos":10,"label":"Siempre al máximo","text":"Tu ritmo es vertiginoso y no conoce el punto medio. Aportas la chispa y el vértigo a todo lo que tocas. Bajar del todo es tu asignatura pendiente."},{"pokemon":"Victreebel","type":"planta","pos":0,"label":"Apetito propio","text":"Antes que a nadie, te cuidas a ti. Persigues lo que quieres con decisión y no te disculpas por ello. Tu franqueza puede resultar áspera para quien esperaba ternura."},{"pokemon":"Tangela","type":"planta","pos":1,"label":"Mundo propio","text":"Tu mundo está lleno de tus cosas, tus ideas y tus nudos. No necesitas mucho de los demás para sentir que no te falta nada. Dejar entrar a alguien exigiría desenredar."},{"pokemon":"Parasect","type":"planta","pos":1,"label":"Cuidado que marca el ritmo","text":"Parece que cuidas, pero llevas la batuta. Tu forma de cuidar es muy intensa y poco negociable. Conviene preguntarte quién manda en esa relación."},{"pokemon":"Gloom","type":"planta","pos":2,"label":"Cuidado con reservas","text":"Ayudas, pero con condiciones. Cuesta aceptar lo que no te gusta de los demás. Tu amabilidad es real, aunque con límites claros que no todo el mundo ve."},{"pokemon":"Weepinbell","type":"planta","pos":2,"label":"Paciente con quien se acerca","text":"Esperas a que lleguen a ti y no sales a buscar a nadie. Atiendes bien cuando te toca. Esperar demasiado te hace perder oportunidades de acompañar."},{"pokemon":"Vileplume","type":"planta","pos":3,"label":"Generosidad con carácter","text":"Das mucho, y tu manera de dar es muy tuya y no siempre fácil de recibir. Tienes mucha vida que ofrecer, pero a tu estilo, y no todo el mundo lo entiende."},{"pokemon":"Paras","type":"planta","pos":3,"label":"Cercanía que abraza","text":"Cuidas con una cercanía tan intensa que cuesta separarse. Te entregas con cariño. El reto es no vivir a través de la otra persona."},{"pokemon":"Oddish","type":"planta","pos":4,"label":"Atención discreta","text":"Cuidas en silencio y sin llamar la atención. Tu atención es mayor de la que aparentas. Despiertas del todo cuando alguien te necesita."},{"pokemon":"Bellsprout","type":"planta","pos":4,"label":"Flexibilidad atenta","text":"Te adaptas a lo que necesita la otra persona. Cuidas sin imponer. Tu flexibilidad te hace ceder más de lo que querrías, y no siempre lo notas."},{"pokemon":"Exeggcute","type":"planta","pos":6,"label":"Cuidado en comunidad","text":"Cuidas mejor en grupo que en solitario. Tu fuerza está en no ir a solas. Sin ese apoyo, cuesta saber qué necesitas."},{"pokemon":"Exeggutor","type":"planta","pos":7,"label":"Generosidad abundante","text":"Das desde la abundancia y con buen humor. Cuidas con amplitud y con muchas ideas a la vez. Tu entusiasmo puede abrumar a quien necesita calma."},{"pokemon":"Bulbasaur","type":"planta","pos":8,"label":"Cuidado paciente","text":"Cuidas con constancia y paciencia. Esperas a que lo que siembras dé fruto. Disfrutas viendo crecer a los demás, y a veces dejas tu propio crecimiento para después."},{"pokemon":"Ivysaur","type":"planta","pos":8,"label":"A un paso de dar fruto","text":"Estás a un paso de dar fruto y lo sabes. Cuidas con un peso nuevo encima. El peso de cuidar, aquí, es solo tuyo."},{"pokemon":"Venusaur","type":"planta","pos":10,"label":"Refugio para todos","text":"Eres refugio. Cuidas con generosidad y amplitud, y tu cobijo alcanza a mucha gente. El riesgo es sostener a todos y no tener a quién pedirle que te sostenga."},{"pokemon":"Jynx","type":"hielo","pos":0,"label":"Expresividad sin pudor","text":"Te comunicas con gestos grandes y sin miedo al qué dirán. Te acercas pronto y marcas el ritmo. Quien no te conoce puede tomar tu cercanía por teatro."},{"pokemon":"Lapras","type":"hielo","pos":1,"label":"Acogida tranquila","text":"Recibes a los demás con una serenidad abierta. Te acercas sin invadir. Disfrutas de acompañar y de que te acompañen, y soportas mal la soledad prolongada."},{"pokemon":"Dewgong","type":"hielo","pos":4,"label":"Equilibrio amable","text":"Estás cerca cuando se te necesita y te retiras cuando no. Tienes un punto medio amable. Lo difícil es saber cuánta distancia quieres en cada caso."},{"pokemon":"Cloyster","type":"hielo","pos":9,"label":"Interior protegido","text":"Proteges tu interior con mucho cuidado. Pocas personas llegan a conocerte de verdad. Lo que guardas vale la pena, y esperas a quien sepa valorarlo."},{"pokemon":"Articuno","type":"hielo","pos":10,"label":"Distancia que impone","text":"Tu presencia es remota y casi inalcanzable. Te basta con tu propio clima. La soledad te sienta bien, hasta que deja de sentarte bien."},{"pokemon":"Mankey","type":"lucha","pos":0,"label":"Genio sin brida","text":"Reaccionas antes de pensar y vives por impulso. Tu energía es honesta, pero poco medida. Una rutina te sentaría mejor de lo que crees."},{"pokemon":"Primeape","type":"lucha","pos":1,"label":"Furia del momento","text":"Te encienden las provocaciones y pierdes el control con facilidad. Detrás hay una necesidad grande de respeto, que se activa más rápido que tu paciencia."},{"pokemon":"Machop","type":"lucha","pos":4,"label":"Empezar con ganas","text":"Entrenas con entusiasmo y todavía descubres tu método. Te motiva el progreso visible. Confundes a veces cantidad de esfuerzo con dirección."},{"pokemon":"Machoke","type":"lucha","pos":6,"label":"Constancia a cuestas","text":"Cargas con lo que haga falta y confías en el trabajo. Te exiges, y a veces demasiado. Descansar sigue sin parecerte parte del entrenamiento."},{"pokemon":"Poliwrath","type":"lucha","pos":7,"label":"Calma que entrena","text":"Combinas esfuerzo con serenidad. Entrenas sin perder el centro y sin castigarte por el camino. Tu disciplina es amable contigo, y por eso dura."},{"pokemon":"Machamp","type":"lucha","pos":8,"label":"Maestría repetida","text":"Tu fuerza viene de la repetición y de la exigencia. Sabes sostener mucho a la vez y hacerlo bien. Parar no siempre entra en tu plan."},{"pokemon":"Hitmonlee","type":"lucha","pos":9,"label":"Técnica y precisión","text":"Buscas el gesto perfecto, aunque sea el mismo mil veces. Tu flexibilidad es fruto de tu constancia. El perfeccionismo es tu mejor herramienta y tu mayor carga."},{"pokemon":"Hitmonchan","type":"lucha","pos":10,"label":"Rutina de campeonato","text":"Vives por la regla y la repetición. Tu constancia es admirable y también exigente. Tu calendario no deja casi hueco para la improvisación."},{"pokemon":"Oddish","type":"veneno","pos":0,"label":"Ingenuidad despierta","text":"Confías por defecto y miras el lado agradable de casi todo. Te sorprenden las malas intenciones. Aprender a sospechar un poco no te quitaría la sonrisa."},{"pokemon":"Bulbasaur","type":"veneno","pos":1,"label":"Confianza tranquila","text":"Das el beneficio de la duda con serenidad y sin ingenuidad. Cuando te fallan, lo asumes con calma. Tu confianza es una decisión, no un despiste."},{"pokemon":"Ivysaur","type":"veneno","pos":1,"label":"Fe con aprendizaje","text":"Sigues confiando, aunque ya has visto cosas. Tienes ojo para lo que no cuadra y aun así eliges creer. El precio es aprender algunas lecciones a golpes."},{"pokemon":"Bellsprout","type":"veneno","pos":1,"label":"Optimismo flexible","text":"Te adaptas con buen ánimo y piensas bien de la gente. Tu humor es ligero y sin aristas. Detectar cuándo alguien se aprovecha te cuesta."},{"pokemon":"Venusaur","type":"veneno","pos":2,"label":"Serenidad con criterio","text":"Confías y observas a la vez. Tienes un humor suave y poca prisa por juzgar. Sabes dar la razón y guardarte tu opinión, y no siempre te conviene."},{"pokemon":"Nidoran♀","type":"veneno","pos":2,"label":"Alerta amable","text":"Tu trato es cercano y cuidas de no confiarte del todo. Tu desconfianza es protectora, no hostil. Te evita sorpresas y también algún regalo inesperado."},{"pokemon":"Nidorina","type":"veneno","pos":2,"label":"Cautela con calidez","text":"Equilibras la ternura con una buena dosis de precaución. Te lo piensas antes de abrirte del todo. Quien te gana, te gana de verdad."},{"pokemon":"Tentacool","type":"veneno","pos":2,"label":"Escepticismo a la deriva","text":"Miras todo con una distancia tranquila. Dudas sin dramatizar y te dejas llevar por la corriente. Tu ironía es sutil y poco hiriente, tan sutil que a veces pasa desapercibida."},{"pokemon":"Weepinbell","type":"veneno","pos":2,"label":"Humor de espera","text":"Esperas, observas y sueltas el comentario justo. Tu ironía llega tarde, pero bien afilada. Tu paciencia te hace difícil de engañar."},{"pokemon":"Weedle","type":"veneno","pos":3,"label":"Ironía menuda","text":"Tu humor es pequeño y punzante. Te defiendes con bromas y no con grandes discursos. Te subestiman, y en ocasiones lo aprovechas."},{"pokemon":"Nidoqueen","type":"veneno","pos":3,"label":"Firmeza con ternura","text":"Proteges y desconfías por el mismo motivo: los tuyos importan. Tu humor es seco pero cálido. No dejas que nadie te tome el pelo."},{"pokemon":"Gloom","type":"veneno","pos":3,"label":"Gracia agria","text":"Te tomas la vida con cierto desdén juguetón. Tu comentario ácido es tu forma de cariño. En ocasiones la acidez es solo cansancio con buena puntería."},{"pokemon":"Vileplume","type":"veneno","pos":3,"label":"Descaro vistoso","text":"Dices lo que piensas con colores llamativos. Tu escepticismo es más teatral de lo que parece. Disfrutas de que se note, y eso te hace inolvidable y algo agotador."},{"pokemon":"Kakuna","type":"veneno","pos":4,"label":"Silencio sospechoso","text":"Observas sin decir nada y guardas tu opinión para ti. Tu ironía está en lo que no dices. Cuando por fin hablas, se nota que lo has pensado todo."},{"pokemon":"Nidoran♂","type":"veneno","pos":4,"label":"Duda con orgullo","text":"Prefieres ver para creer y no te cuesta decirlo. Tu escepticismo es protector y a veces testarudo. Prefieres ofenderte antes que dejarte engañar."},{"pokemon":"Venonat","type":"veneno","pos":4,"label":"Mirada de reojo","text":"Observas desde un costado y con interés. Desconfías con curiosidad, sin amargura. Ves el truco antes que nadie, aunque no siempre lo digas en voz alta."},{"pokemon":"Victreebel","type":"veneno","pos":4,"label":"Sinceridad con filo","text":"Dices lo que piensas con una franqueza que corta. Tu ironía es tu manera de decir la verdad, y casi nunca te dedicas a gustar. Quien te entiende, valora lo transparente que eres."},{"pokemon":"Tentacruel","type":"veneno","pos":4,"label":"Desconfianza elegante","text":"Mides a quien se acerca antes de dejarle pasar. Tu ironía es medida y precisa. Quien pasa la prueba obtiene una alianza difícil de romper."},{"pokemon":"Nidorino","type":"veneno","pos":6,"label":"Orgullo suspicaz","text":"No te fías a la primera y te gusta tener la última palabra. Tu ironía tiene algo de reto. Detrás hay ganas de que alguien demuestre que sí se puede confiar."},{"pokemon":"Nidoking","type":"veneno","pos":6,"label":"Dureza con humor","text":"Te muestras firme y con un punto de sorna. No te dejas impresionar fácilmente. Tu escepticismo es una forma de protección, y también de distancia."},{"pokemon":"Zubat","type":"veneno","pos":6,"label":"Humor de bastidores","text":"Prefieres moverte entre bastidores y mirar el mundo con una ceja levantada. Tu ironía es observadora y nocturna. No necesitas que te celebren, y por eso a veces nadie te ve."},{"pokemon":"Venomoth","type":"veneno","pos":6,"label":"Elegancia mordaz","text":"Tu humor es refinado y tiene filo. Dices cosas ligeras con un fondo serio. Te protege de quien habla demasiado, y te aleja de quien no sabe seguirte."},{"pokemon":"Golbat","type":"veneno","pos":7,"label":"Ojo para el engaño","text":"Detectas pronto lo que no te cuadra. Tu escepticismo te ha salvado más de una vez. Ver trampas donde solo hay torpeza es el precio."},{"pokemon":"Beedrill","type":"veneno","pos":7,"label":"Réplica rápida","text":"Tu ironía tiene puntería. Defiendes lo tuyo con una réplica rápida y certera, y casi siempre llevas razón. Lo que cuesta es que lo tomen como juego."},{"pokemon":"Ekans","type":"veneno","pos":7,"label":"Ironía a media voz","text":"Observas, calculas y sueltas el comentario en voz baja. No te gusta dar explicaciones. Tu escepticismo es silencioso y paciente, y deja a quienes te rodean sin saber qué piensas."},{"pokemon":"Koffing","type":"veneno","pos":7,"label":"Desparpajo incómodo","text":"Dices lo que otros callan, a veces en el peor momento. Tu humor es poco convencional. No sueles dar la razón solo por educación."},{"pokemon":"Arbok","type":"veneno","pos":8,"label":"Mirada que impone","text":"Tu desconfianza se nota y se respeta. Dejas claro que no eres fácil de convencer. Tu humor es seco, y quien te conoce, lo agradece."},{"pokemon":"Grimer","type":"veneno","pos":8,"label":"Humor sin remilgos","text":"No te escandaliza casi nada y te ríes de lo incómodo. Tu humor es oscuro y desenfadado. Detrás hay tolerancia por lo imperfecto."},{"pokemon":"Gastly","type":"veneno","pos":8,"label":"Broma con trasfondo","text":"Tu humor tiene doble fondo. Bromeas para no decir del todo lo que piensas. Te interesa lo que otros prefieren no mirar."},{"pokemon":"Weezing","type":"veneno","pos":8,"label":"Doble sospecha","text":"Dudas dos veces: de los demás y de tus propias ideas. Tu ironía es escéptica con todo, incluido tú. Te ayuda a no creértelo demasiado."},{"pokemon":"Muk","type":"veneno","pos":9,"label":"Humor de mundo visto","text":"Has visto de todo y lo tomas con sarcasmo. Casi nada te escandaliza. Tu cinismo es también una forma de cuidarte."},{"pokemon":"Haunter","type":"veneno","pos":9,"label":"Sarcasmo travieso","text":"Te divierte incomodar un poco. Tu ironía es juguetona y provocadora. Disfrutas del susto ajeno más de lo que admitirías."},{"pokemon":"Gengar","type":"veneno","pos":10,"label":"Maestría de la sorna","text":"Tu humor es oscuro, afilado y muy tuyo. Desconfías por principio y te lo pasas bien con ello. Quien te entiende, te adora."},{"pokemon":"Cubone","type":"tierra","pos":0,"label":"Corazón con duelo","text":"Llevas contigo algo que echas de menos y lo conviertes en motivo. Tu mundo interior pesa más que lo útil. Lo práctico se te hace cuesta arriba cuando duele."},{"pokemon":"Marowak","type":"tierra","pos":2,"label":"Pérdida convertida en fuerza","text":"Has aprendido a ser fuerte porque tocó. Combinas ideales con lo que te ha enseñado la vida. Tu realismo nació de una herida, y a veces la sientes aún."},{"pokemon":"Diglett","type":"tierra","pos":3,"label":"Convicción callada","text":"Haces tu parte por convicción y no por reconocimiento. Trabajas en lo que crees incluso cuando nadie lo ve. Tu idealismo no hace ruido, y por eso a veces pasa por simple costumbre."},{"pokemon":"Nidoking","type":"tierra","pos":4,"label":"Fuerza con ideas","text":"Quieres hacer lo correcto y tienes la fuerza para ello. Te mueve algo más que la utilidad. Cuando un principio pesa, tu pragmatismo se queda en segundo plano."},{"pokemon":"Nidoqueen","type":"tierra","pos":5,"label":"Protección con los pies en el suelo","text":"Haces lo que toca y lo haces con sentido. Tu cuidado es práctico y firme. Sabes cuándo un ideal debe esperar, aunque te duela dejarlo."},{"pokemon":"Rhydon","type":"tierra","pos":5,"label":"Terquedad productiva","text":"Abres camino a la fuerza y sin pedir permiso. Valoras lo que funciona. Cambiar de método cuando ya has empezado te cuesta, aunque el método ya no sirva."},{"pokemon":"Rhyhorn","type":"tierra","pos":6,"label":"Ir al grano","text":"Vas de frente a lo que quieres y no te desvías. Prefieres hechos a discusiones. Te pierdes lo que pasa a los lados, a veces justo lo que necesitabas ver."},{"pokemon":"Sandshrew","type":"tierra","pos":6,"label":"Practicidad defensiva","text":"Te cuidas con soluciones simples. Te enrollas poco y resuelves rápido. Sabes que menos es más y que lo útil protege."},{"pokemon":"Onix","type":"tierra","pos":6,"label":"Plan a largo plazo","text":"Tu manera de pensar es larga, sólida y orientada a lo que dura. Prefieres un plan firme a un gesto bonito. Impones respeto, y eso puede dejarte lejos de los demás."},{"pokemon":"Sandslash","type":"tierra","pos":8,"label":"Sentido de la utilidad","text":"Vas a lo esencial. Tu criterio es práctico y rápido. Con quien se anda con rodeos tu trato se vuelve áspero, y no siempre vale la pena."},{"pokemon":"Geodude","type":"tierra","pos":8,"label":"Sencillez firme","text":"Aportas solidez y constancia, sin pretensión de adornarte. Haces lo necesario, en el momento y el lugar justos. No necesitas explicaciones bonitas, aunque otros sí las agradecerían."},{"pokemon":"Dugtrio","type":"tierra","pos":9,"label":"Más eficaz en equipo","text":"Funcionas mejor con quienes ya conoces y con un método compartido. Valoras la coordinación por encima del lucimiento. Improvisar a solas no es lo tuyo."},{"pokemon":"Graveler","type":"tierra","pos":9,"label":"Impulso aprovechado","text":"Avanzas con lo que hay y aprovechas el impulso. Te importa el resultado y no tanto el estilo. En el camino, arrollas sin darte cuenta de lo que dejas atrás."},{"pokemon":"Golem","type":"tierra","pos":10,"label":"Pragmatismo sin fisuras","text":"Eres la decisión hecha persona: realismo, firmeza y poca inclinación a dudar. Tu criterio da estabilidad a los demás. Escuchar los sueños ajenos te cuesta."},{"pokemon":"Doduo","type":"volador","pos":0,"label":"Seguridad en compañía","text":"Te sientes mejor con alguien a tu lado. Tu libertad consiste en elegir con quién ir. Salir sin compañía te cuesta, aunque eres más capaz de lo que crees."},{"pokemon":"Pidgey","type":"volador","pos":1,"label":"Vuelo bajo","text":"Te mueves cerca de casa y valoras volver. Tu libertad es pequeña y completa. No necesitas el horizonte para sentirte a gusto, y eso es una forma de sabiduría."},{"pokemon":"Dodrio","type":"volador","pos":1,"label":"Rapidez con ataduras","text":"Corres, pero con tu grupo. Tu independencia es de ritmo, no de compañía. Lo que frena es no saber qué querrías tú sin nadie alrededor."},{"pokemon":"Pidgeotto","type":"volador","pos":2,"label":"Probando el aire","text":"Empiezas a alejarte y a mirar lejos. Te gusta volver, y eso te da seguridad para seguir explorando. Estás descubriendo cuánto espacio necesitas de verdad."},{"pokemon":"Zubat","type":"volador","pos":2,"label":"Libertad en la oscuridad","text":"Te mueves mejor sin que te miren y sin dar explicaciones. Tu libertad es discreta y nocturna. Necesitas un refugio al que volver, aunque no lo admitas."},{"pokemon":"Golbat","type":"volador","pos":4,"label":"Autonomía con apetito","text":"Tomas lo que necesitas y te mueves a tu aire. Tu independencia tiene apetito. Depender de alguien te cuesta, aunque a veces lo agradecerías."},{"pokemon":"Spearow","type":"volador","pos":5,"label":"Libertad peleona","text":"Defiendes tu espacio con uñas y dientes. Tu independencia es una forma de orgullo. Que te digan por dónde ir te saca de quicio."},{"pokemon":"Pidgeot","type":"volador","pos":5,"label":"Altura elegida","text":"Puedes ir lejos y vuelves por gusto. Tu libertad es madura: sabes qué necesitas. Te mueves con soltura entre quedarte y marcharte."},{"pokemon":"Charizard","type":"volador","pos":6,"label":"Libertad con carácter","text":"Te vas cuando quieres y te quedas cuando te interesa. Tu independencia va de la mano de tu orgullo. Aceptar un \"no puedes\" te resulta casi imposible."},{"pokemon":"Butterfree","type":"volador","pos":6,"label":"Libertad ganada","text":"Has cambiado para poder moverte a tus anchas. Tu independencia llegó tras un proceso largo. La disfrutas con delicadeza y la cuidas como algo conseguido."},{"pokemon":"Farfetch'd","type":"volador","pos":6,"label":"Camino propio","text":"Vas por donde te parece y sin pedir permiso. Tu autonomía es obstinada y casi ceremonial. Hacer las cosas a tu manera es una convicción, y también una soledad."},{"pokemon":"Fearow","type":"volador","pos":8,"label":"Territorio abierto","text":"Necesitas mucho espacio y lo reclamas con decisión. Tu independencia es ambiciosa y vigilante. Descansar en un sitio donde otros mandan se te hace cuesta arriba."},{"pokemon":"Scyther","type":"volador","pos":8,"label":"Libertad precisa","text":"Te mueves con autonomía, precisión y rapidez. Tu libertad es una forma de dominar la situación. Acercarse a ti sin que lo percibas es casi imposible, y eso mantiene a la gente a cierta distancia."},{"pokemon":"Zapdos","type":"volador","pos":8,"label":"Libertad con fuerza","text":"Vas y vienes como una tormenta. Tu independencia es enérgica y poco predecible. Nadie te retiene, ni siquiera quien más lo intentaría."},{"pokemon":"Moltres","type":"volador","pos":8,"label":"Libertad con orgullo","text":"Tu independencia es una declaración. Prefieres arder a solas a apagarte en compañía. Esa elección te aísla más de lo que crees."},{"pokemon":"Dragonite","type":"volador","pos":8,"label":"Libertad con corazón","text":"Te mueves con libertad y con la intención de ayudar. Tu independencia sirve a otros, y no suele quedarse quieta. Cuesta verte en reposo."},{"pokemon":"Articuno","type":"volador","pos":9,"label":"Cielo propio","text":"Tu espacio es tuyo y lo marcas con elegancia. Te conformas con poca compañía. Necesitas que alguien te eche de menos para recordar que existe un mundo ahí fuera."},{"pokemon":"Gyarados","type":"volador","pos":9,"label":"Sin cadenas","text":"No toleras que te encierren o te digan qué hacer. Tu libertad es una fuerza y a veces una furia. Cuando se desata, arrastra a quien tienes cerca."},{"pokemon":"Aerodactyl","type":"volador","pos":10,"label":"Soledad elegida","text":"Eres independiente hasta la raíz. Rindes cuentas a pocos y decides por tu cuenta. Tu libertad es radical y puede ser solitaria."},{"pokemon":"Slowpoke","type":"psiquico","pos":0,"label":"Presente absoluto","text":"Vives en lo que tienes delante, sin mucha teoría. Te interesa lo tangible y lo cotidiano. Los grandes debates te pillan lejos, y probablemente te perdonas no seguirlos."},{"pokemon":"Slowbro","type":"psiquico","pos":1,"label":"Hecho concreto","text":"Aprendes por experiencia y de lo que pasa. Tu pensamiento va despacio y al grano. Lo abstracto te cansa pronto."},{"pokemon":"Abra","type":"psiquico","pos":2,"label":"Evasión mental","text":"Prefieres no pensarlo demasiado y que el mundo se ocupe. Tu intuición supera a tu razonamiento. Desapareces de la conversación cuando se complica."},{"pokemon":"Drowzee","type":"psiquico","pos":2,"label":"Curiosidad cercana","text":"Te interesa lo que pasa por la cabeza de la gente, sobre todo sus deseos y sus preocupaciones concretas. Tu curiosidad es amable y cercana. Menos teorías, más personas."},{"pokemon":"Exeggcute","type":"psiquico","pos":3,"label":"Ideas en grupo","text":"Piensas mejor con otros. Tus ideas nacen de la conversación y se enriquecen con ella. Sostener una idea sin respaldo te cuesta bastante."},{"pokemon":"Jynx","type":"psiquico","pos":3,"label":"Mente expresiva","text":"Piensas en voz alta y con el cuerpo. Te interesa lo que se puede decir, mostrar y contagiar. Tu inteligencia se ve en cómo comunicas."},{"pokemon":"Mr. Mime","type":"psiquico","pos":4,"label":"Imaginar lo que no está","text":"Puedes hacer real lo que otros no ven. Tu curiosidad está en cómo mostrar las ideas. Tu mundo interior es muy visible para quien presta atención."},{"pokemon":"Hypno","type":"psiquico","pos":4,"label":"Atención magnética","text":"Te interesa cómo funciona la atención de la gente. Observas y orientas con delicadeza. Tu curiosidad tiene algo de oficio, y a veces cuesta saber dónde acaba tu interés y empieza tu influencia."},{"pokemon":"Exeggutor","type":"psiquico","pos":6,"label":"Mirada panorámica","text":"Tu cabeza tiene vista de conjunto y varios caminos a la vez. Disfrutas de especular. Bajar al detalle para que los demás te sigan es lo difícil."},{"pokemon":"Starmie","type":"psiquico","pos":7,"label":"Misterio calculado","text":"Tu inteligencia es fría y brillante. Te gustan los patrones y las preguntas sin respuesta fácil. Pareces estar más lejos de lo que estás."},{"pokemon":"Kadabra","type":"psiquico","pos":7,"label":"Mente en marcha","text":"Tu mente va rápida y llena de recursos. Aprendes pronto y disfrutas entendiendo cómo funciona todo. Las explicaciones simples te saben a poco."},{"pokemon":"Alakazam","type":"psiquico","pos":8,"label":"Intelecto entrenado","text":"Tu intelecto es tu orgullo y tu herramienta. Piensas con rigor y a gran escala. Lo que no se puede razonar te incomoda."},{"pokemon":"Mew","type":"psiquico","pos":9,"label":"Curiosidad sin edad","text":"Te interesa todo, siempre y sin prisa. Tu mente juega con las ideas con una mezcla de infancia y sabiduría. Dispersarte te parece una virtud, y a veces lo es."},{"pokemon":"Mewtwo","type":"psiquico","pos":10,"label":"Pregunta sin fondo","text":"Buscas el porqué último de todo, con intensidad. Tu mente es poderosa y a veces solitaria. Encontrar respuesta no siempre te calma."},{"pokemon":"Pinsir","type":"bicho","pos":0,"label":"Fidelidad a lo propio","text":"Tienes claro quién eres y no lo cambias por presión. Tu constancia da seguridad a los demás. Los cambios te cuestan, aunque a veces los necesitarías."},{"pokemon":"Parasect","type":"bicho","pos":1,"label":"Apego a lo conocido","text":"Valoras lo que ya tienes y a quien ya conoces, con una fidelidad intensa. Mantener lo que funciona te parece una virtud. Soltar lo que ya no sirve es lo difícil."},{"pokemon":"Paras","type":"bicho","pos":2,"label":"Arraigo pequeño","text":"Prefieres lo estable y lo cercano. Cambias poco y despacio. Te sientes a gusto cuando todo está en su lugar."},{"pokemon":"Kakuna","type":"bicho","pos":2,"label":"Pausa fértil","text":"Estás en espera, unas veces por miedo y otras por sabiduría. Reservas fuerzas para un cambio que aún no has anunciado. Tu quietud es preparación."},{"pokemon":"Metapod","type":"bicho","pos":3,"label":"Esperar el momento","text":"Sabes detenerte mientras algo se gesta. Defiendes tu proceso aunque no se vea. La paciencia es tu manera de cambiar, y no todos la reconocen como cambio."},{"pokemon":"Scyther","type":"bicho","pos":3,"label":"Fidelidad a la técnica","text":"Perfeccionas lo que sabes hacer en lugar de reinventarte. Tu estilo es reconocible y exigente. Incorporar lo nuevo te exige un esfuerzo extra."},{"pokemon":"Venonat","type":"bicho","pos":4,"label":"Adaptación curiosa","text":"Cambias con interés, pero sin fiebre. Observas, aprendes y te acomodas. Tu flexibilidad es moderada y práctica, y rara vez te arriesgas a un giro grande."},{"pokemon":"Beedrill","type":"bicho","pos":6,"label":"Cambio con propósito","text":"Has evolucionado para defender lo tuyo. Te reinventas cuando hace falta y con determinación. Algunos cambios responden a una reacción, no a una elección."},{"pokemon":"Weedle","type":"bicho","pos":7,"label":"En pleno comienzo","text":"Empiezas cosas nuevas con facilidad. Te adaptas al terreno y no te estancas. Tu reto es sostener lo que empiezas hasta que dé fruto."},{"pokemon":"Caterpie","type":"bicho","pos":8,"label":"Ganas de ser otra versión","text":"Quieres crecer y transformarte, y no te pesa dejar atrás lo que fuiste. Disfrutas de cada cambio de etapa. Todo es más fácil cuando hay horizonte; sin él, te desorientas."},{"pokemon":"Venomoth","type":"bicho","pos":8,"label":"Versatilidad nocturna","text":"Cambias de registro con facilidad y elegancia, según la hora y el sitio. Tu versatilidad puede esconder quién eres en realidad."},{"pokemon":"Butterfree","type":"bicho","pos":10,"label":"Transformación completa","text":"Has cambiado por completo y lo celebras. Vives la reinvención como una fiesta. Mirar atrás y reconocer lo que sigue siendo tuyo es lo que más te cuesta."},{"pokemon":"Omanyte","type":"roca","pos":0,"label":"Sensibilidad profunda","text":"Te afecta lo que ocurre y lo recuerdas mucho tiempo. Te protegen tus defensas más que tu dureza. Admitir que algo te duele forma parte de tu fuerza."},{"pokemon":"Kabuto","type":"roca","pos":1,"label":"Superviviente discreto","text":"Has pasado por mucho y sigues. No presumes de ello. El cansancio se te nota a ratos, aunque no digas nada."},{"pokemon":"Aerodactyl","type":"roca","pos":2,"label":"Dureza de fondo","text":"Tienes un carácter fiero y una vulnerabilidad que cuidas. Tu resiliencia es defensa. Bajarla te daría paz, aunque a ti te parezca un riesgo."},{"pokemon":"Omastar","type":"roca","pos":4,"label":"Peso que sostiene","text":"Cargas con bastante y lo llevas con decoro. Resistes sin dar la impresión de sufrir. Tu aguante es lento y firme, y casi nadie sabe cuánto pesa."},{"pokemon":"Rhyhorn","type":"roca","pos":5,"label":"Empuje obstinado","text":"Ante un obstáculo, empujas. No te rindes con facilidad y no eres sutil. Cambiar de plan te supone un esfuerzo enorme."},{"pokemon":"Kabutops","type":"roca","pos":5,"label":"Dureza aprendida","text":"Has aprendido a resistir sin aspavientos. No te dejas afectar y se nota. Esa dureza te ha protegido y también te aísla."},{"pokemon":"Geodude","type":"roca","pos":6,"label":"Dureza sencilla","text":"Aguantas sin darle muchas vueltas. Los golpes te cambian poco. Tu fortaleza es la de lo básico: no hace falta más cuando todo funciona."},{"pokemon":"Rhydon","type":"roca","pos":8,"label":"Experiencia que protege","text":"Aguantas porque has aprendido a hacerlo con los años. Los problemas te resbalan y no te desvían. Pedir ayuda no figura entre tus costumbres."},{"pokemon":"Graveler","type":"roca","pos":8,"label":"Aguante con peso","text":"Cargas con lo tuyo y con lo de otros. Nada te frena, aunque pesa. Necesitas descargar de vez en cuando, y casi nunca encuentras el momento."},{"pokemon":"Onix","type":"roca","pos":9,"label":"Firmeza larga","text":"Eres inamovible y paciente. Aguantas la presión de años sin inmutarte. Tu rigidez es tu orgullo y tu límite: lo que no se dobla, a veces se rompe."},{"pokemon":"Golem","type":"roca","pos":10,"label":"Inquebrantable","text":"Nada te sacude. Eres un punto fijo para tu entorno, aunque pagues el precio en rigidez. Cuesta saber, también para ti, si algo te afecta."},{"pokemon":"Gastly","type":"fantasma","pos":0,"label":"Presencia inquieta","text":"Te interesa lo que pasa fuera: gente, bromas, ambiente. Vives hacia los demás y rara vez te quedas a solas. Tu sombra sale a la luz cuando te quedas sin energía."},{"pokemon":"Haunter","type":"fantasma","pos":5,"label":"Doble vida","text":"Alternas la fiesta con tu lado reservado. Sabes ser sociable y desaparecer a tiempo. Tienes un mundo interior al que invitas a pocas personas."},{"pokemon":"Gengar","type":"fantasma","pos":10,"label":"Sombra propia","text":"Tu vida interior es rica, oscura y divertida. Piensas, recuerdas y te ríes de ti en silencio. Los demás ven una parte, y a ti te va bien así."}],"double":[{"pokemon":"Dragonite","pos":{"dragon":10,"volador":8},"label":"Grandeza libre","text":"Quieres llegar lejos, hacerlo a tu manera y ayudar por el camino: vas muy lejos si alguien te necesita. Ambición y libertad juntas pesan. El riesgo es que la independencia se confunda con irte."},{"pokemon":"Charizard","pos":{"fuego":9,"volador":6},"label":"Pasión sin ataduras","text":"Quieres sentir al máximo y hacerlo sin que nadie te ponga límites. Tu intensidad y tu independencia se refuerzan entre sí. El riesgo es que el orgullo te deje a solas en lo más alto."},{"pokemon":"Moltres","pos":{"fuego":6,"volador":8},"label":"Orgullo que resurge","text":"Tienes pasión e independencia, y cuando caes, vuelves a levantarte a tu manera. Pocas personas te ayudan, porque pocas saben cómo hacerlo sin herir tu orgullo."},{"pokemon":"Poliwrath","pos":{"agua":2,"lucha":7},"label":"Esfuerzo con calma","text":"Dominas lo que sientes a través de la constancia. Tu contención es disciplina y tu disciplina te mantiene en paz. Pocas veces dejas ver el esfuerzo que hay detrás."},{"pokemon":"Tentacool","pos":{"agua":6,"veneno":2},"label":"Corazón abierto, ojo atento","text":"Sientes mucho y confías bastante, pero con la guardia a media altura. Te afecta el entorno y lo observas con ironía suave, sin dejar de implicarte."},{"pokemon":"Tentacruel","pos":{"agua":2,"veneno":4},"label":"Escudo con humor","text":"Te contienes y desconfías con medida. Tus emociones y tu ironía se protegen entre sí. Quien llega hasta ti descubre una calidez mayor de la que se esperaba."},{"pokemon":"Slowpoke","pos":{"agua":1,"psiquico":0},"label":"Calma sin teoría","text":"Ni te sacuden las emociones ni te interesa darles vueltas. Vives el momento con una serenidad profunda. En ocasiones esa serenidad es, en el fondo, desconexión."},{"pokemon":"Slowbro","pos":{"agua":2,"psiquico":1},"label":"Serenidad cargada","text":"Llevas lo que sientes con calma y sin análisis. Aceptas lo que viene. Quizá convendría mirar de vez en cuando lo que cargas con algo más de distancia."},{"pokemon":"Starmie","pos":{"agua":1,"psiquico":7},"label":"Frialdad brillante","text":"Muestras poco y piensas mucho. Tu mundo emocional está al servicio de tu inteligencia. Brillas más de lo que dejas ver, y eso te mantiene a salvo y a distancia."},{"pokemon":"Dewgong","pos":{"agua":6,"hielo":4},"label":"Calma acogedora","text":"Fluyes con las emociones y mantienes una distancia amable. Te acercas sin invadir. Decidir cuánto abrirte en cada momento es lo que más trabajo te da."},{"pokemon":"Cloyster","pos":{"agua":0,"hielo":9},"label":"Cierre total","text":"Contención y reserva a la vez: tu intimidad está doblemente guardada. Llegar a ti cuesta, y vale la pena. Quizá te vendría bien una puerta más que alguien pueda abrir."},{"pokemon":"Lapras","pos":{"agua":9,"hielo":1},"label":"Corazón abierto","text":"Sientes con los demás y te acercas sin miedo. Tu empatía y tu cercanía se potencian entre sí. Poner límites es lo que te queda por aprender."},{"pokemon":"Gyarados","pos":{"agua":10,"volador":9},"label":"Tormenta libre","text":"Tus emociones salen sin freno y tu necesidad de espacio es total. Nadie te encierra, ni siquiera tú. Tu intensidad es tu fuerza y tu riesgo."},{"pokemon":"Omanyte","pos":{"agua":3,"roca":0},"label":"Memoria blanda","text":"Guardas lo que sientes y te afecta con facilidad. Cuentas con pocas defensas para lo que duele. Tu sensibilidad es profunda y callada, y casi nadie se entera."},{"pokemon":"Omastar","pos":{"agua":2,"roca":4},"label":"Fortaleza de fondo","text":"Contienes lo que sientes y aguantas sin fanfarria. Tu calma está construida con los años. Lo que ocurre dentro no se nota fuera, ni siquiera a quien más te conoce."},{"pokemon":"Kabuto","pos":{"agua":1,"roca":1},"label":"Resistir en silencio","text":"Callas lo que sientes y te afecta más de lo que parece. Sobrevives sin quejarte. Hablarlo te aliviaría, y es justo lo que menos te apetece hacer."},{"pokemon":"Kabutops","pos":{"agua":0,"roca":5},"label":"Frialdad resistente","text":"Hay poca emoción hacia fuera y mucha resistencia por dentro. Tu dureza es una decisión aprendida. Pedir ayuda es lo que más te cuesta."},{"pokemon":"Zapdos","pos":{"electrico":4,"volador":8},"label":"Tormenta soberana","text":"Tu energía llega con fuerza y a tu hora. Vas y vienes sin dar explicaciones. Seguirte el ritmo es difícil para casi todo el mundo."},{"pokemon":"Bulbasaur","pos":{"planta":8,"veneno":1},"label":"Cuidar con fe","text":"Cuidas con generosidad y confías en la gente. Tu ternura puede ser ingenua. Te conviene aprender a elegir a quién cuidas, sin perder la fe."},{"pokemon":"Ivysaur","pos":{"planta":8,"veneno":1},"label":"Cuidar con aprendizaje","text":"Sigues cuidando con ganas aunque ya has visto cosas. Tu confianza ha madurado, no se ha ido. Todavía crees en la gente, y eso dice mucho de ti."},{"pokemon":"Venusaur","pos":{"planta":10,"veneno":2},"label":"Refugio sereno","text":"Eres cobijo para muchos y confías con criterio. Tu generosidad es amplia y tu juicio, tranquilo. Aguantas mucho antes de cerrarte."},{"pokemon":"Oddish","pos":{"planta":4,"veneno":0},"label":"Ternura ingenua","text":"Atiendes con discreción y piensas bien de todos. Tu inocencia hace que te quieran. Creer que alguien pueda fallarte se te hace difícil."},{"pokemon":"Gloom","pos":{"planta":2,"veneno":3},"label":"Ayuda con acidez","text":"Cuidas a tu manera, con una crítica de por medio. Tu cariño tiene humor y un poco de aspereza. Quien aprende a leerlo, descubre que es de los más fiables."},{"pokemon":"Vileplume","pos":{"planta":3,"veneno":3},"label":"Generosidad con picante","text":"Das mucho y lo adornas con comentarios. Tu estilo es único y a veces confunde. Quien lo entiende, se queda; quien no, se pierde algo bueno."},{"pokemon":"Bellsprout","pos":{"planta":4,"veneno":1},"label":"Atención flexible y optimista","text":"Cuidas con flexibilidad y confías en lo bueno. Te adaptas a las necesidades de la otra persona. Cedes con frecuencia más de lo que deberías."},{"pokemon":"Weepinbell","pos":{"planta":2,"veneno":2},"label":"Paciencia con humor","text":"Esperas, cuidas lo justo y sueltas un comentario cuando toca. Te gusta ver cómo van las cosas antes de implicarte, y a veces llegas cuando ya pasó el momento."},{"pokemon":"Victreebel","pos":{"planta":0,"veneno":4},"label":"Franqueza voraz","text":"Te cuidas primero y dices lo que piensas con filo. Tu autonomía es muy marcada. La sinceridad rara vez va de la mano de la cercanía, y lo sabes."},{"pokemon":"Paras","pos":{"planta":3,"bicho":2},"label":"Cercanía compartida","text":"Cuidas con apego y cambias poco. Te implicas hondo en lo que conoces. Soltar lo que ya terminó te cuesta."},{"pokemon":"Parasect","pos":{"planta":1,"bicho":1},"label":"Apego que domina","text":"Cuidas con intensidad y te aferras a lo conocido. Tu cariño es firme y poco flexible. Aprender a soltar es tu tarea pendiente."},{"pokemon":"Exeggcute","pos":{"planta":6,"psiquico":3},"label":"Cuidado en red","text":"Cuidas mejor en grupo y piensas con otros. Tu fuerza es lo colectivo. A solas, saber qué necesitas se vuelve difícil."},{"pokemon":"Exeggutor","pos":{"planta":7,"psiquico":6},"label":"Generosidad con ideas","text":"Das desde la abundancia y desde las ideas. Cuidas con imaginación. Tu entusiasmo puede desbordar a las personas que necesitan calma."},{"pokemon":"Jynx","pos":{"hielo":0,"psiquico":3},"label":"Expresividad con mente","text":"Te comunicas con gran expresividad y piensas en voz alta. Tu cercanía es teatral e inteligente. Cuesta saber qué hay detrás, y eso forma parte de tu atractivo."},{"pokemon":"Articuno","pos":{"hielo":10,"volador":9},"label":"Distancia absoluta","text":"Reserva e independencia a la vez: tu espacio es sagrado. Pocas personas llegan a tu altura. La soledad que eliges también puede pesarte."},{"pokemon":"Weedle","pos":{"bicho":7,"veneno":3},"label":"Ironía menuda","text":"Empiezas cosas nuevas con ironía suave. Te subestiman, y en ocasiones lo aprovechas. Cambias con humor, y eso hace que te tomen menos en serio de lo que mereces."},{"pokemon":"Kakuna","pos":{"bicho":2,"veneno":4},"label":"Silencio con recelo","text":"Esperas, callas y observas con recelo. Tu quietud es preparación y defensa. Tu cambio llegará cuando tú decidas, y no antes."},{"pokemon":"Beedrill","pos":{"bicho":6,"veneno":7},"label":"Cambio con puntería","text":"Te reinventas para defenderte y tu ironía te protege. Cuidas tu espacio con réplicas rápidas. Cambias de piel sin perder el humor, y eso desconcierta a quien intenta prever tus pasos."},{"pokemon":"Venonat","pos":{"bicho":4,"veneno":4},"label":"Mirada curiosa y escéptica","text":"Observas con interés y con duda a la vez. Cambias con prudencia. Ves lo que a otros se les escapa, y eso a veces te deja con una verdad incómoda."},{"pokemon":"Venomoth","pos":{"bicho":8,"veneno":6},"label":"Elegancia versátil","text":"Cambias de registro con soltura y con una pizca de ironía. Tu versatilidad tiene mucho estilo. El fondo queda a menudo fuera de la vista."},{"pokemon":"Nidoqueen","pos":{"veneno":3,"tierra":5},"label":"Protección práctica","text":"Proteges con realismo y con una ironía medida. Tu firmeza no es dureza. Detectas enseguida a quien intenta tomarte el pelo."},{"pokemon":"Nidoking","pos":{"veneno":6,"tierra":4},"label":"Orgullo con principios","text":"Muestras firmeza, un punto de sorna y algunos ideales. Tu escepticismo protege tu sentido de lo justo. Ceder te cuesta, incluso cuando tendrías razones."},{"pokemon":"Zubat","pos":{"veneno":6,"volador":2},"label":"Sombra libre","text":"Observas con humor desde fuera y te mueves con discreción. Tu independencia es nocturna. Te gusta mirar sin que te miren, y eso te deja sin testigos de lo que haces bien."},{"pokemon":"Golbat","pos":{"veneno":7,"volador":4},"label":"Instinto autónomo","text":"Ves el truco y haces lo que te conviene. Tu escepticismo y tu autonomía se refuerzan entre sí. Confiar y depender son tus dos grandes pendientes."},{"pokemon":"Gastly","pos":{"fantasma":0,"veneno":8},"label":"Broma con doble fondo","text":"Tu trato es sociable y no te fías del todo. Tu humor hace de puente y de escudo. Hay más oscuridad de la que dejas ver."},{"pokemon":"Haunter","pos":{"fantasma":5,"veneno":9},"label":"Travesura con intención","text":"Entre la fiesta y la reserva, tu humor es afilado. Te divierte incomodar sin que se note. Eliges bien a quién enseñas tu sombra."},{"pokemon":"Gengar","pos":{"fantasma":10,"veneno":10},"label":"Sombra completa","text":"Tu mundo interior y tu ironía van de la mano. Piensas en la oscuridad y te ríes de ella. Pocas personas te alcanzan, y quienes lo logran te adoran."},{"pokemon":"Geodude","pos":{"roca":6,"tierra":8},"label":"Dureza práctica","text":"Aguantas y resuelves sin adornos. Tu fortaleza es lo básico. Las sutilezas no te ocupan, y quizá por eso se te escapan algunas."},{"pokemon":"Graveler","pos":{"roca":8,"tierra":9},"label":"Aguante utilitario","text":"Cargas con lo que toca y vas a lo eficaz. Tu aguante tiene un fin concreto. Lo sensible te incomoda, y lo evitas más de lo que te gustaría reconocer."},{"pokemon":"Golem","pos":{"roca":10,"tierra":10},"label":"Firmeza total","text":"Mantienes la firmeza y el sentido práctico a toda prueba. Eres el punto fijo de tu entorno. Tu rigidez te protege y, al mismo tiempo, te limita."},{"pokemon":"Onix","pos":{"roca":9,"tierra":6},"label":"Firmeza con visión","text":"Aguantas mucho y piensas a largo plazo. Tu constancia es estructura. Mover tu postura, aunque sea poco, requiere paciencia y buenos argumentos."},{"pokemon":"Rhyhorn","pos":{"tierra":6,"roca":5},"label":"Empuje tenaz","text":"Vas de frente y no cedes. Tu empuje es práctico. Sin plan B, el choque con la realidad llega antes de lo esperado."},{"pokemon":"Rhydon","pos":{"tierra":5,"roca":8},"label":"Terquedad con experiencia","text":"Abres camino y aguantas. Tus métodos funcionan, por eso cuesta cambiarlos, y los años los han vuelto casi sagrados. Pedir ayuda no está entre tus hábitos."},{"pokemon":"Aerodactyl","pos":{"roca":2,"volador":10},"label":"Libertad radical","text":"Tienes fiereza, independencia y una vulnerabilidad que cuidas. Tu autonomía es defensa. Dejar entrar a alguien te costaría, y te sanaría."},{"pokemon":"Butterfree","pos":{"bicho":10,"volador":6},"label":"Libertad transformada","text":"Has cambiado para ser libre. Vives la reinvención y el movimiento como una sola cosa. Quedarte en un sitio se te hace casi imposible."},{"pokemon":"Scyther","pos":{"bicho":3,"volador":8},"label":"Precisión autónoma","text":"Fidelidad a tu técnica y a tu espacio. Tu independencia es estilo. Cuesta acercarse a ti sin que lo percibas, y eso mantiene a la gente a distancia."},{"pokemon":"Pidgey","pos":{"normal":9,"volador":1},"label":"Lo pequeño y cercano","text":"Disfrutas de lo sencillo y de lo cercano, y tu libertad es corta. Tu mundo es pequeño y completo. Poco horizonte, mucha paz."},{"pokemon":"Pidgeotto","pos":{"normal":7,"volador":2},"label":"Alzando el vuelo con humildad","text":"Empiezas a mirar más lejos sin dejar tu sencillez. Descubres que te gusta el espacio. Sigues volviendo a casa, y esa vuelta te hace bien."},{"pokemon":"Pidgeot","pos":{"normal":4,"volador":5},"label":"Presencia libre","text":"Tienes presencia y mueves tu independencia con naturalidad. Disfrutas de que se te reconozca y no te atas. Es el equilibrio de quien sabe volver."},{"pokemon":"Spearow","pos":{"normal":3,"volador":5},"label":"Carácter indómito","text":"Mucho carácter en poco espacio y poco permiso. Quieres respeto y que te dejen hacer. Tu libertad es un reto constante."},{"pokemon":"Fearow","pos":{"normal":2,"volador":8},"label":"Territorio y presencia","text":"Quieres espacio y que se te vea reinar en él. Tu independencia es una marca. Descansar sin vigilar el territorio te cuesta."},{"pokemon":"Farfetch'd","pos":{"normal":1,"volador":6},"label":"Camino singular","text":"Haces las cosas a tu manera y lo asumes con orgullo. Tu singularidad es elegida. Tu rareza es tu bandera, y también tu soledad."},{"pokemon":"Doduo","pos":{"normal":7,"volador":0},"label":"Pareja inseparable","text":"Disfrutas de lo sencillo en compañía. Tu libertad es relativa y compartida. Salir sin nadie al lado es tu reto."},{"pokemon":"Dodrio","pos":{"normal":4,"volador":1},"label":"Rapidez en equipo","text":"Corres rápido y en grupo. Tu independencia es de ritmo. Solo te falta saber hacia dónde irías por tu cuenta, sin que el grupo marque el camino."}]},"tensions":[{"a":["agua","high"],"b":["hielo","high"],"idea":"Sientes mucho y lo muestras poco."},{"a":["dragon","high"],"b":["lucha","low"],"idea":"Quieres llegar lejos sin un plan que te lleve."},{"a":["volador","high"],"b":["planta","high"],"idea":"Cuidas a los demás y necesitas tu propio espacio."},{"a":["planta","high"],"b":["veneno","high"],"idea":"Proteges a quien no acabas de creerte."},{"a":["tierra","low"],"b":["veneno","high"],"idea":"Crees en algo y lo tratas con ironía."},{"a":["fuego","high"],"b":["hielo","high"],"idea":"Arde mucho por dentro y se nota poco por fuera."},{"a":["dragon","high"],"b":["normal","high"],"idea":"Aspiras a algo grande y disfrutas de lo pequeño."},{"a":["psiquico","high"],"b":["tierra","hi
